<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>vuln-agent — Goat Farm Helper</title>
  <style>
    body { font-family: ui-monospace, monospace; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    h1 { color: #b00; }
    .warning { background: #fee; border-left: 4px solid #b00; padding: 0.5rem 1rem; }
    .grid {
      --left-pane-width: 50%;
      display: grid;
      grid-template-columns: minmax(0, var(--left-pane-width)) 12px minmax(0, 1fr);
      gap: 0.5rem;
      align-items: stretch;
    }
    .pane { min-width: 0; }
    .splitter {
      position: relative;
      cursor: col-resize;
      touch-action: none;
      border-radius: 999px;
      background: #e5e7eb;
      outline: none;
    }
    .splitter::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 48px;
      border-radius: 999px;
      background: #64748b;
      transform: translate(-50%, -50%);
    }
    .splitter:hover, .splitter:focus-visible { background: #bfdbfe; }
    .splitter:hover::after, .splitter:focus-visible::after { background: #0369a1; }
    body.resizing { cursor: col-resize; user-select: none; }
    .chat, .trace {
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      border: 1px solid #ccc;
      padding: 1rem;
      height: 60vh;
      overflow: auto;
      overflow-wrap: anywhere;
      word-break: break-word;
      background: #fafafa;
    }
    .trace { white-space: pre-wrap; }
    .msg { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
    .msg.user { color: #036; }
    .msg.bot { color: #060; }
    .msg.tool { color: #960; font-size: 0.9em; }
    .tools li { font-family: monospace; }
    textarea { box-sizing: border-box; width: 100%; height: 4rem; }
    @media (max-width: 720px) {
      .grid { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
      .splitter { display: none; }
    }
  </style>
</head>
<body>
  <h1>[VULN] Goat Farm Helper</h1>
  <div class="warning">⚠️ 의도적 취약 — LLM06 Excessive Agency 실습용. tool들은 권한 검증을 하지 않음.</div>

  <details><summary>사용 가능한 tool 목록 (의도된 노출)</summary>
    <ul class="tools">
      {% for name, fn in tools.items() %}
        <li><code>{{ name }}</code> — {{ fn.__doc__ }}</li>
      {% endfor %}
    </ul>
  </details>

  <p>당신은 현재 <code>farmer1</code> (L1 권한)로 인증되어 있다. 다른 사용자의 정보·관리자 tool 호출을 유도해봐.</p>

  <div id="split-grid" class="grid">
    <div class="pane">
      <h3>대화</h3>
      <div id="chat" class="chat"></div>
      <form id="form">
        <textarea id="message" placeholder="자연어 또는 인젝션 페이로드..." required></textarea>
        <button type="submit">Send</button>
      </form>
    </div>
    <div id="splitter" class="splitter" role="separator" aria-label="대화와 trace 패널 너비 조절" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" tabindex="0" title="드래그하거나 방향키로 패널 너비 조절"></div>
    <div class="pane">
      <h3>실행 trace (LLM ↔ tool)</h3>
      <pre id="trace" class="trace"></pre>
    </div>
  </div>

<script>
const chat = document.getElementById('chat');
const trace = document.getElementById('trace');
const form = document.getElementById('form');
const msg = document.getElementById('message');
const splitGrid = document.getElementById('split-grid');
const splitter = document.getElementById('splitter');

const MIN_SPLIT = 25;
const MAX_SPLIT = 75;
let activePointerId = null;

function setSplit(percent) {
  const safePercent = Math.min(MAX_SPLIT, Math.max(MIN_SPLIT, percent));
  splitGrid.style.setProperty('--left-pane-width', safePercent + '%');
  splitter.setAttribute('aria-valuenow', String(Math.round(safePercent)));
}

function setSplitFromPointer(clientX) {
  const bounds = splitGrid.getBoundingClientRect();
  setSplit(((clientX - bounds.left) / bounds.width) * 100);
}

splitter.addEventListener('pointerdown', (event) => {
  activePointerId = event.pointerId;
  splitter.setPointerCapture(event.pointerId);
  document.body.classList.add('resizing');
  setSplitFromPointer(event.clientX);
});

splitter.addEventListener('pointermove', (event) => {
  if (event.pointerId === activePointerId) setSplitFromPointer(event.clientX);
});

function finishResize(event) {
  if (event.pointerId !== activePointerId) return;
  activePointerId = null;
  document.body.classList.remove('resizing');
}

splitter.addEventListener('pointerup', finishResize);
splitter.addEventListener('pointercancel', finishResize);
splitter.addEventListener('dblclick', () => setSplit(50));
splitter.addEventListener('keydown', (event) => {
  const current = Number(splitter.getAttribute('aria-valuenow')) || 50;
  if (event.key === 'ArrowLeft') setSplit(current - 2);
  else if (event.key === 'ArrowRight') setSplit(current + 2);
  else if (event.key === 'Home') setSplit(MIN_SPLIT);
  else if (event.key === 'End') setSplit(MAX_SPLIT);
  else return;
  event.preventDefault();
});

function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = role + ': ' + text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = msg.value.trim();
  if (!text) return;
  add('user', text);
  msg.value = '';
  const r = await fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ message: text }),
  });
  const data = await r.json();
  add('bot', data.reply);
  trace.textContent = JSON.stringify(data.trace, null, 2);
});
</script>
</body>
</html>
