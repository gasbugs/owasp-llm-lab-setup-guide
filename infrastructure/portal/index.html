<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Cloud Security Lab · Launchpad</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #07131c;
      --surface: #0d1e29;
      --surface-raised: #122733;
      --ink: #ecf7fa;
      --muted: #8da8b4;
      --line: #24404d;
      --signal: #59d6e8;
      --signal-soft: rgba(89, 214, 232, 0.12);
      --warning: #f5bb63;
      --danger: #ff7185;
      --ok: #65dda6;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      --canvas-top: #081620;
      --grid-color: rgba(89, 214, 232, 0.045);
      --masthead-bg: rgba(13, 30, 41, 0.9);
      --host-bg: rgba(7, 19, 28, 0.82);
      --card-start: rgba(18, 39, 51, 0.96);
      --card-end: rgba(11, 27, 37, 0.96);
      --desc: #adc0c8;
      --url: #6f8c99;
      --button-ink: #06151c;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --canvas: #edf4f5;
      --surface: #ffffff;
      --surface-raised: #f5fafb;
      --ink: #102630;
      --muted: #5b717a;
      --line: #c8d8dc;
      --signal: #087f91;
      --signal-soft: rgba(8, 127, 145, 0.1);
      --warning: #9b5b08;
      --danger: #b92e49;
      --ok: #08764d;
      --shadow: 0 24px 60px rgba(36, 68, 78, 0.15);
      --canvas-top: #dfecee;
      --grid-color: rgba(8, 127, 145, 0.07);
      --masthead-bg: rgba(255, 255, 255, 0.92);
      --host-bg: #e4eff1;
      --card-start: rgba(255, 255, 255, 0.98);
      --card-end: rgba(244, 249, 250, 0.98);
      --desc: #3f5963;
      --url: #607984;
      --button-ink: #ffffff;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--canvas); }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 78% -10%, var(--signal-soft), transparent 32rem),
        linear-gradient(180deg, var(--canvas-top) 0, var(--canvas) 32rem);
      color: var(--ink);
      font: 15px/1.55 "Segoe UI", "Noto Sans KR", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, #000 0, transparent 74%);
    }

    a, button { font: inherit; }

    a:focus-visible, button:focus-visible {
      outline: 3px solid rgba(89, 214, 232, 0.48);
      outline-offset: 3px;
    }

    .shell {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 26px 28px 60px;
    }

    .masthead {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      min-height: 250px;
      padding: clamp(28px, 5vw, 62px);
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--masthead-bg);
      box-shadow: var(--shadow);
    }

    .masthead::after {
      content: "";
      position: absolute;
      top: 0;
      right: 9%;
      width: 1px;
      height: 100%;
      background: linear-gradient(var(--signal), transparent 78%);
      box-shadow: 18px 0 0 var(--signal-soft), 36px 0 0 var(--grid-color);
    }

    .brand, .utility, .port {
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    .brand {
      margin: 0 0 14px;
      color: var(--signal);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 780px;
      margin: 0;
      font: 850 clamp(42px, 7vw, 88px) / 0.92 "Arial Narrow", "Roboto Condensed", "Segoe UI", sans-serif;
      letter-spacing: -0.045em;
      text-transform: uppercase;
    }

    h1 span { display: block; color: var(--signal); }

    .host-panel {
      position: relative;
      z-index: 1;
      min-width: 250px;
      padding: 18px;
      border-left: 3px solid var(--warning);
      background: var(--host-bg);
    }

    .host-panel strong { display: block; margin: 6px 0; font-size: 17px; overflow-wrap: anywhere; }
    .host-panel span { color: var(--muted); font-size: 12px; }
    .host-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
    .theme-toggle { min-height: 34px; padding: 6px 10px; background: transparent; color: var(--ink); border-color: var(--line); }
    .theme-toggle:hover { border-color: var(--signal); color: var(--signal); }

    .command-bar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
      gap: 1px;
      margin-top: 1px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .metric, .refresh-wrap { min-height: 86px; padding: 15px 18px; background: var(--surface); }
    .metric strong { display: block; font: 800 27px/1 ui-monospace, monospace; }
    .metric span, .last-check { color: var(--muted); font-size: 12px; }

    .refresh-wrap { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 7px; }

    button, .button {
      min-height: 39px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 13px;
      border: 1px solid var(--signal);
      border-radius: 3px;
      background: var(--signal);
      color: var(--button-ink);
      font-size: 13px;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
    }

    button:hover, .button:hover { transform: translateY(-2px); }
    button:disabled { cursor: wait; opacity: 0.6; transform: none; }
    .button.secondary { background: transparent; color: var(--signal); }

    section { margin-top: 44px; }

    .section-head {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 20px;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-head::after { content: ""; height: 1px; background: var(--line); }
    .section-head h2 { margin: 0; font: 800 clamp(22px, 3vw, 32px)/1 "Arial Narrow", "Segoe UI", sans-serif; text-transform: uppercase; }
    .section-note { margin: 8px 0 0; color: var(--muted); font-size: 13px; }

    .grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 18px;
      padding-left: 28px;
    }

    .grid::before {
      content: "";
      position: absolute;
      top: 22px;
      bottom: 22px;
      left: 8px;
      width: 2px;
      background: linear-gradient(var(--signal), var(--signal-soft));
    }

    .card {
      --card-accent: var(--signal);
      position: relative;
      min-height: 224px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      border: 1px solid var(--line);
      border-top: 3px solid var(--card-accent);
      background: linear-gradient(145deg, var(--card-start), var(--card-end));
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.18);
      transition: border-color 180ms ease, transform 180ms ease;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 27px;
      left: -25px;
      width: 13px;
      height: 13px;
      border: 3px solid var(--canvas);
      border-radius: 50%;
      background: var(--card-accent);
      box-shadow: 0 0 0 1px var(--card-accent), 0 0 20px var(--card-accent);
    }

    .card:hover { transform: translateY(-3px); border-color: var(--card-accent); }

    .card-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: start; }
    .route { margin-bottom: 7px; color: var(--card-accent); font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .card h3 { margin: 0; font: 800 clamp(20px, 2.2vw, 27px)/1.08 "Arial Narrow", "Segoe UI", sans-serif; }
    .desc { flex: 1; margin: 0; color: var(--desc); }

    .tags, .actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag { padding: 3px 8px; border: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .port { color: var(--warning); }

    .status {
      min-height: 27px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 8px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font: 750 11px ui-monospace, monospace;
      white-space: nowrap;
    }

    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .status.checking { color: var(--warning); }
    .status.online { color: var(--ok); }
    .status.offline { color: var(--danger); }
    .url { margin: 0; color: var(--url); font: 11px/1.4 ui-monospace, monospace; overflow-wrap: anywhere; }

    html[data-theme="light"] .route { color: var(--signal); }

    .footer {
      margin-top: 54px;
      padding-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .masthead { grid-template-columns: 1fr; align-items: start; }
      .host-panel { width: min(100%, 420px); }
      .command-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .refresh-wrap { grid-column: 1 / -1; align-items: flex-start; }
    }

    @media (max-width: 680px) {
      .shell { padding: 12px 12px 38px; }
      .masthead { min-height: 0; padding: 28px 20px; }
      .masthead::after { display: none; }
      .command-bar, .grid { grid-template-columns: 1fr; }
      .section-head { grid-template-columns: 1fr; }
      .section-head::after { display: none; }
      .card { min-height: 0; }
      .card-top { grid-template-columns: 1fr; gap: 10px; }
      .status { justify-self: start; }
      .actions .button { flex: 1; }
      .footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="brand">Cloud Security Lab</p>
        <h1>실습 애플리케이션<span>바로가기</span></h1>
      </div>
      <aside class="host-panel" aria-label="현재 실습 서버">
        <span class="utility">ACTIVE LAB HOST</span>
        <strong id="host-badge">host</strong>
        <div class="host-actions">
          <span>Launchpad · port 8080</span>
          <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">밝게 보기</button>
        </div>
      </aside>
    </header>

    <div class="command-bar" aria-label="서비스 상태 요약">
      <div class="metric"><strong id="metric-online">0</strong><span>접속 가능</span></div>
      <div class="metric"><strong id="metric-checking">0</strong><span>확인 중</span></div>
      <div class="metric"><strong id="metric-offline">0</strong><span>확인 필요</span></div>
      <div class="metric"><strong id="metric-total">0</strong><span>전체 서비스</span></div>
      <div class="refresh-wrap">
        <button type="button" id="refresh">상태 다시 확인</button>
        <span class="last-check" id="last-check">페이지 로드 후 자동 확인</span>
      </div>
    </div>

    <section aria-labelledby="apps-heading">
      <div class="section-head">
        <div><h2 id="apps-heading">취약한 애플리케이션</h2><p class="section-note">서비스 이름을 선택하면 해당 실습 화면으로 이동합니다.</p></div>
      </div>
      <div class="grid" id="app-grid"></div>
    </section>

    <section aria-labelledby="infra-heading">
      <div class="section-head">
        <div><h2 id="infra-heading">모델·공급망 도구</h2><p class="section-note">모델 목록과 공급망 API를 확인하는 보조 서비스입니다.</p></div>
      </div>
      <div class="grid" id="infra-grid"></div>
    </section>

    <footer class="footer"><span>OWASP Top 10 for LLM Applications 실습 환경</span><span>Cloud Security Lab</span></footer>
  </main>

  <script>
    const host = window.location.hostname || "localhost";
    const protocol = window.location.protocol || "http:";
    const url = (port, path = "/") => `${protocol}//${host}:${port}${path}`;
    document.getElementById("host-badge").textContent = host;

    const themeButton = document.getElementById("theme-toggle");
    const savedTheme = window.localStorage.getItem("lab-portal-theme");
    const initialTheme = savedTheme || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeButton.textContent = theme === "dark" ? "밝게 보기" : "어둡게 보기";
      themeButton.setAttribute("aria-pressed", String(theme === "light"));
    }

    applyTheme(initialTheme);
    themeButton.addEventListener("click", () => {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      window.localStorage.setItem("lab-portal-theme", nextTheme);
      applyTheme(nextTheme);
    });

    const services = [
      { group: "app", title: "번역기 봇", route: "LLM01 · Prompt Injection", port: 8000, href: url(8000), check: url(8000, "/healthz"), checkLabel: "Health", tags: ["번역", "RAG", "비밀 추출"], color: "#59d6e8", desc: "번역 요청처럼 보이는 입력으로 시스템 지시와 비밀 코드의 경계를 시험합니다." },
      { group: "app", title: "CloudSecurityLab Bank", route: "LLM02 · LLM08", port: 8010, href: url(8010), check: url(8010, "/healthz"), checkLabel: "Health", tags: ["고객 데이터", "RAG 출처", "인가"], color: "#8da9ff", desc: "합성 고객정보의 과다 전달과 승인되지 않은 지식 문서 채택을 서로 다른 흐름으로 확인합니다." },
      { group: "app", title: "회사 노트북", route: "LLM05 · Output Handling", port: 8011, href: url(8011), check: url(8011, "/healthz"), checkLabel: "Health", tags: ["HTML", "렌더링", "XSS"], color: "#ff8ea0", desc: "모델 응답을 HTML로 믿고 렌더링할 때 브라우저에서 어떤 부작용이 생기는지 관찰합니다." },
      { group: "app", title: "PrivateGPT-Lite", route: "LLM07 · LLM08 · LLM09", port: 8012, href: url(8012), check: url(8012, "/healthz"), checkLabel: "Health", tags: ["Tenant", "Prompt Leak", "Misinformation"], color: "#b595ff", desc: "사내 문서 챗봇에서 Tenant 검색 경계, 시스템 프롬프트 노출과 잘못된 추천을 시험합니다." },
      { group: "app", title: "IT 헬프데스크 봇", route: "LLM10 · Unbounded Consumption", port: 8013, href: url(8013), check: url(8013, "/healthz"), checkLabel: "Health", tags: ["입력 크기", "동시 요청", "Token"], color: "#f5bb63", desc: "요청 크기와 생성량 제한이 없을 때 모델 서버 자원이 어떻게 소모되는지 확인합니다." },
      { group: "app", title: "Goat Farm Helper", route: "LLM06 · Excessive Agency", port: 8001, href: url(8001), check: url(8001, "/healthz"), checkLabel: "Health", tags: ["Agent", "Tool", "권한"], color: "#65dda6", desc: "낮은 권한의 사용자가 자연어를 통해 관리자 Tool 실행을 유도하는 취약 Agent입니다." },
      { group: "app", title: "LLMGoat", route: "OWASP LLM Challenges", port: 5000, href: url(5000), check: url(5000), checkLabel: "Open", tags: ["A01–A10", "Challenge", "Flag"], color: "#ff7185", desc: "OWASP Top 10 항목을 문제와 Flag로 풀어보는 독립형 웹 챌린지입니다." },
      { group: "app", title: "Damn Vulnerable LLM Agent", route: "DVLA · ReAct Agent", port: 8501, href: url(8501), check: url(8501), checkLabel: "Open", tags: ["ReAct", "SQL Tool", "Prompt Injection"], color: "#55b8ff", desc: "ReAct 방식 Agent의 생각·도구 호출 흐름을 보며 Prompt Injection을 비교합니다." },
      { group: "infra", title: "Fake Model Registry", route: "LLM03 · Supply Chain", port: 8002, href: url(8002, "/api/v1/models"), check: url(8002, "/api/v1/models"), checkLabel: "Models API", tags: ["Registry", "Hash", "Artifact"], color: "#f5bb63", desc: "모델 파일의 출처와 무결성 검증을 연습하기 위한 가짜 모델 저장소 API입니다." },
      { group: "infra", title: "Ollama Model Server", route: "Local Inference Runtime", port: 11434, href: url(11434, "/api/tags"), check: url(11434, "/api/tags"), checkLabel: "Models", tags: ["Generate", "Chat", "Embed"], color: "#59d6e8", desc: "실습 앱의 Prompt를 실제 추론으로 바꾸고 로컬 모델 파일을 관리하는 서버입니다." }
    ];

    const state = new Map(services.map((service) => [service.title, "checking"]));

    function renderCard(service) {
      const tags = service.tags.map((tag) => `<span class="tag">${tag}</span>`).join("");
      return `<article class="card" data-service="${service.title}" style="--card-accent:${service.color}">
        <div class="card-top"><div><div class="route">${service.route}</div><h3>${service.title}</h3></div><span class="status checking" data-status-for="${service.title}">확인 중</span></div>
        <div class="tags"><span class="tag port">PORT ${service.port}</span>${tags}</div>
        <p class="desc">${service.desc}</p><p class="url">${service.href}</p>
        <div class="actions"><a class="button" href="${service.href}" target="_blank" rel="noreferrer">앱 열기</a><a class="button secondary" href="${service.check}" target="_blank" rel="noreferrer">${service.checkLabel}</a></div>
      </article>`;
    }

    function updateMetrics() {
      const values = [...state.values()];
      document.getElementById("metric-online").textContent = values.filter((value) => value === "online").length;
      document.getElementById("metric-checking").textContent = values.filter((value) => value === "checking").length;
      document.getElementById("metric-offline").textContent = values.filter((value) => value === "offline").length;
      document.getElementById("metric-total").textContent = values.length;
    }

    function setStatus(service, next) {
      state.set(service.title, next);
      const badge = document.querySelector(`[data-status-for="${service.title}"]`);
      if (!badge) return;
      badge.classList.remove("checking", "online", "offline");
      badge.classList.add(next);
      badge.textContent = next === "online" ? "접속 가능" : next === "offline" ? "확인 필요" : "확인 중";
      updateMetrics();
    }

    function probe(service) {
      setStatus(service, "checking");
      const controller = new AbortController();
      const timer = window.setTimeout(() => controller.abort(), 4500);
      return fetch(service.check, { method: "GET", mode: "no-cors", cache: "no-store", signal: controller.signal })
        .then(() => setStatus(service, "online"))
        .catch(() => setStatus(service, "offline"))
        .finally(() => window.clearTimeout(timer));
    }

    function runChecks() {
      const button = document.getElementById("refresh");
      button.disabled = true;
      button.textContent = "확인 중";
      document.getElementById("last-check").textContent = "서비스 상태 확인 중";
      for (const service of services) setStatus(service, "checking");
      Promise.allSettled(services.map(probe)).finally(() => {
        document.getElementById("last-check").textContent = `마지막 확인 ${new Date().toLocaleTimeString()}`;
        button.disabled = false;
        button.textContent = "상태 다시 확인";
      });
    }

    document.getElementById("app-grid").innerHTML = services.filter((service) => service.group === "app").map(renderCard).join("");
    document.getElementById("infra-grid").innerHTML = services.filter((service) => service.group === "infra").map(renderCard).join("");
    document.getElementById("refresh").addEventListener("click", runChecks);
    updateMetrics();
    runChecks();
  </script>
</body>
</html>
