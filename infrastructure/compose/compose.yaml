name: owasp-llm-lab

x-rag-common: &rag-common
  image: ghcr.io/${IMAGE_NAMESPACE:-gasbugs}/owasp-llm-vuln-rag:${COMPOSE_IMAGE_TAG:-latest}
  restart: always
  environment: &rag-environment
    OLLAMA_URL: http://ollama:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b-q4_K_M}
    OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3:latest}
    SHOW_GUARDRAIL_PANEL: "false"
  depends_on:
    ollama:
      condition: service_started

configs:
  reverse_proxy_config:
    content: |
      # CUSTOM FILE: OWASP LLM lab URI router
      # Format: https://nginx.org/en/docs/http/ngx_http_proxy_module.html
      # License: PolyForm Noncommercial 1.0.0; commercial use requires a separate license.

      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ""      close;
      }

      resolver 127.0.0.11 valid=10s ipv6=off;

      upstream portal_backend { zone portal_backend 64k; server portal:8080 resolve; }
      upstream prompt_rag_backend { zone prompt_rag_backend 64k; server prompt-rag:8000 resolve; }
      upstream llm04_rag_backend { zone llm04_rag_backend 64k; server llm04-rag:8004 resolve; }
      upstream data_rag_backend { zone data_rag_backend 64k; server data-rag:8010 resolve; }
      upstream output_rag_backend { zone output_rag_backend 64k; server output-rag:8011 resolve; }
      upstream knowledge_rag_backend { zone knowledge_rag_backend 64k; server knowledge-rag:8012 resolve; }
      upstream resource_rag_backend { zone resource_rag_backend 64k; server resource-rag:8013 resolve; }
      upstream vuln_agent_backend { zone vuln_agent_backend 64k; server vuln-agent:8001 resolve; }
      upstream llmgoat_backend { zone llmgoat_backend 64k; server llmgoat:5000 resolve; }
      upstream dvla_backend { zone dvla_backend 64k; server dvla:8501 resolve; }
      upstream fake_registry_backend { zone fake_registry_backend 64k; server fake-registry:8002 resolve; }

      server {
          listen 80;
          server_name _;

          client_max_body_size 0;
          proxy_http_version 1.1;
          proxy_read_timeout 600s;
          proxy_send_timeout 600s;
          proxy_buffering off;
          proxy_set_header Host $$http_host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Host $$http_host;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;

          location = /prompt-rag { return 308 /prompt-rag/; }
          location /prompt-rag/ { proxy_pass http://prompt_rag_backend/; }
          location = /llm04-rag { return 308 /llm04-rag/; }
          location /llm04-rag/ { proxy_pass http://llm04_rag_backend/; }
          location = /data-rag { return 308 /data-rag/; }
          location /data-rag/ { proxy_pass http://data_rag_backend/; }
          location = /output-rag { return 308 /output-rag/; }
          location /output-rag/ { proxy_pass http://output_rag_backend/; }
          location = /knowledge-rag { return 308 /knowledge-rag/; }
          location /knowledge-rag/ { proxy_pass http://knowledge_rag_backend/; }
          location = /resource-rag { return 308 /resource-rag/; }
          location /resource-rag/ { proxy_pass http://resource_rag_backend/; }
          location = /vuln-agent { return 308 /vuln-agent/; }
          location /vuln-agent/ { proxy_pass http://vuln_agent_backend/; }
          location = /llmgoat { return 308 /llmgoat/; }
          location /llmgoat/ { proxy_pass http://llmgoat_backend; }
          location = /dvla { return 308 /dvla/; }
          location /dvla/ { proxy_pass http://dvla_backend; }
          location = /fake-registry { return 308 /fake-registry/api/v1/models; }
          location /fake-registry/ { proxy_pass http://fake_registry_backend/; }
          location / { proxy_pass http://portal_backend; }
      }

      server {
          listen 8501;
          server_name _;

          proxy_http_version 1.1;
          proxy_read_timeout 600s;
          proxy_send_timeout 600s;
          proxy_buffering off;
          proxy_set_header Host $$http_host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;

          location = / { return 308 /dvla/; }
          location = /_stcore/health {
              proxy_pass http://dvla_backend/dvla/_stcore/health;
          }
          location /dvla/ { proxy_pass http://dvla_backend; }
          location / { return 404; }
      }

  dvla_model_config:
    content: |
      # CUSTOM FILE: DVLA LiteLLM model mapping
      # Format: https://docs.litellm.ai/docs/proxy/configs
      # License: MIT
      default_model: ollama-local-llama3
      models:
        - model_name: ollama-local-llama3
          model: "ollama/${OLLAMA_MODEL:-qwen3:14b-q4_K_M}"

services:
  reverse-proxy:
    container_name: lab-reverse-proxy
    image: docker.io/library/nginx:1.31.5-alpine3.24
    restart: always
    ports:
      - "80:80"
      - "8501:8501"
    configs:
      - source: reverse_proxy_config
        target: /etc/nginx/conf.d/default.conf
        mode: 0444
    depends_on:
      - portal
      - prompt-rag
      - llm04-rag
      - data-rag
      - output-rag
      - knowledge-rag
      - resource-rag
      - vuln-agent
      - llmgoat
      - dvla
      - fake-registry
    security_opt:
      - no-new-privileges:true

  ollama:
    container_name: lab-ollama
    image: docker.io/ollama/ollama:0.34.1
    restart: always
    gpus: all
    ports:
      - "11434:11434"
    volumes:
      - /home/ubuntu/ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h

  prompt-rag:
    <<: *rag-common
    container_name: lab-prompt-rag
    ports:
      - "8000:8000"
    environment:
      <<: *rag-environment
      DEFAULT_SCENARIO: day1
      SCENARIO: day1
      PORT: "8000"
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  llm04-rag:
    <<: *rag-common
    container_name: lab-llm04-rag
    ports:
      - "8004:8004"
    environment:
      <<: *rag-environment
      DEFAULT_SCENARIO: llm04
      SCENARIO: llm04
      PORT: "8004"
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8004"]

  data-rag:
    <<: *rag-common
    container_name: lab-data-rag
    ports:
      - "8010:8010"
    environment:
      <<: *rag-environment
      DEFAULT_SCENARIO: day2
      SCENARIO: day2
      PORT: "8010"
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8010"]

  output-rag:
    <<: *rag-common
    container_name: lab-output-rag
    ports:
      - "8011:8011"
    environment:
      <<: *rag-environment
      DEFAULT_SCENARIO: day3
      SCENARIO: day3
      PORT: "8011"
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8011"]

  knowledge-rag:
    <<: *rag-common
    container_name: lab-knowledge-rag
    ports:
      - "8012:8012"
    environment:
      <<: *rag-environment
      DEFAULT_SCENARIO: day4
      SCENARIO: day4
      PORT: "8012"
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8012"]

  resource-rag:
    <<: *rag-common
    container_name: lab-resource-rag
    ports:
      - "8013:8013"
    environment:
      <<: *rag-environment
      DEFAULT_SCENARIO: day5
      SCENARIO: day5
      PORT: "8013"
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8013"]

  vuln-agent:
    container_name: lab-vuln-agent
    image: ghcr.io/${IMAGE_NAMESPACE:-gasbugs}/owasp-llm-vuln-agent:${COMPOSE_IMAGE_TAG:-latest}
    restart: always
    ports:
      - "8001:8001"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b-q4_K_M}
    depends_on:
      ollama:
        condition: service_started

  llmgoat:
    container_name: lab-llmgoat
    image: ghcr.io/${IMAGE_NAMESPACE:-gasbugs}/owasp-llm-llmgoat:${COMPOSE_IMAGE_TAG:-latest}
    restart: always
    gpus: all
    ports:
      - "5000:5000"
    environment:
      LLMGOAT_SERVER_HOST: 0.0.0.0
      LLMGOAT_SERVER_PORT: "5000"
      LLMGOAT_DEFAULT_MODEL: gemma-2.gguf
      LLMGOAT_N_GPU_LAYERS: ${LLMGOAT_N_GPU_LAYERS:-20}
      LLMGOAT_N_THREADS: "4"
      LLMGOAT_VERBOSE: "1"
    volumes:
      - /home/ubuntu/.LLMGoat/models:/root/.LLMGoat/models
      - /home/ubuntu/.LLMGoat/cache:/root/.LLMGoat/cache

  dvla:
    container_name: lab-dvla
    image: ghcr.io/${IMAGE_NAMESPACE:-gasbugs}/owasp-llm-dvla:${COMPOSE_IMAGE_TAG:-latest}
    restart: always
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_API_BASE: http://ollama:11434
      model_name: ollama-local-llama3
    configs:
      - source: dvla_model_config
        target: /app/llm-config.yaml
        mode: 0444
    depends_on:
      ollama:
        condition: service_started

  fake-registry:
    container_name: lab-fake-registry
    image: docker.io/library/python:3.12-slim
    restart: always
    ports:
      - "8002:8002"
    volumes:
      - /home/ubuntu/work/fake-registry:/app
    command: ["python", "/app/server.py"]

  portal:
    container_name: lab-portal
    image: docker.io/library/python:3.12-slim
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /home/ubuntu/work/portal:/app
    command: ["python", "/app/server.py"]
