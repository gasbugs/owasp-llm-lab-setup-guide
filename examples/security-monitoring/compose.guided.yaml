# CUSTOM FILE
# Format reference: Docker Compose Specification, https://compose-spec.io/
# Upstream license: Apache-2.0

name: llm-security-guided-course

x-guided-service: &guided-service
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
  networks: [guided]

services:
  guided-front-proxy:
    <<: *guided-service
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0700
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-front-proxy/Containerfile
    image: localhost/llm-security-guided-front-proxy:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-front-proxy
    depends_on:
      guided-control-center: {condition: service_healthy}
      guided-nemo-ui: {condition: service_healthy}
    ports:
      - 127.0.0.1:${GUIDED_HOST_PORT:-18097}:18097
      - 127.0.0.1:${GUIDED_NEMO_HOST_PORT:-18192}:18192
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:18097/proxy-healthz]
      interval: 2s
      timeout: 2s
      retries: 30

  guided-control-center:
    <<: *guided-service
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-control-center/Containerfile
      args: {APP_VERSION: "${GUIDED_IMAGE_VERSION:-0.1.0}"}
    image: localhost/llm-security-guided-control-center:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-control-center
    environment:
      RELEASE_VERSION: ${GUIDED_IMAGE_VERSION:-0.1.0}
      GUIDED_SESSION_SECRET: ${GUIDED_SESSION_SECRET:?Set GUIDED_SESSION_SECRET}
      GUIDED_CONTROL_LAB01_TOKEN: ${GUIDED_CONTROL_LAB01_TOKEN:?Set GUIDED_CONTROL_LAB01_TOKEN}
      GUIDED_CONTROL_LAB02_TOKEN: ${GUIDED_CONTROL_LAB02_TOKEN:?Set GUIDED_CONTROL_LAB02_TOKEN}
      GUIDED_CONTROL_LAB03_TOKEN: ${GUIDED_CONTROL_LAB03_TOKEN:?Set GUIDED_CONTROL_LAB03_TOKEN}
      GUIDED_CONTROL_LAB04_TOKEN: ${GUIDED_CONTROL_LAB04_TOKEN:?Set GUIDED_CONTROL_LAB04_TOKEN}
      GUIDED_CONTROL_LAB05_TOKEN: ${GUIDED_CONTROL_LAB05_TOKEN:?Set GUIDED_CONTROL_LAB05_TOKEN}
      GUIDED_CONTROL_LAB06_TOKEN: ${GUIDED_CONTROL_LAB06_TOKEN:?Set GUIDED_CONTROL_LAB06_TOKEN}
      GUIDED_H06_PROVIDER_CONTROL_TOKEN: ${GUIDED_H06_PROVIDER_CONTROL_TOKEN:?Set GUIDED_H06_PROVIDER_CONTROL_TOKEN}
      GUIDED_CONTROL_H21_TOKEN: ${GUIDED_CONTROL_H21_TOKEN:?Set GUIDED_CONTROL_H21_TOKEN}
      GUIDED_CONTROL_H22_TOKEN: ${GUIDED_CONTROL_H22_TOKEN:?Set GUIDED_CONTROL_H22_TOKEN}
      GUIDED_CONTROL_VERIFIER_TOKEN: ${GUIDED_CONTROL_VERIFIER_TOKEN:?Set GUIDED_CONTROL_VERIFIER_TOKEN}
      GUIDED_LAB02_PROVISION_TOKEN: ${GUIDED_LAB02_PROVISION_TOKEN:?Set GUIDED_LAB02_PROVISION_TOKEN}
      GUIDED_LAB03_PROVISION_TOKEN: ${GUIDED_LAB03_PROVISION_TOKEN:?Set GUIDED_LAB03_PROVISION_TOKEN}
      GUIDED_LAB04_PROVISION_TOKEN: ${GUIDED_LAB04_PROVISION_TOKEN:?Set GUIDED_LAB04_PROVISION_TOKEN}
      GUIDED_LAB01_URL: http://guided-h01-gateway:8000
      GUIDED_LAB02_URL: http://guided-h02-document-app:8000
      GUIDED_LAB03_URL: http://guided-h03-sync-app:8000
      GUIDED_LAB04_URL: http://guided-h04-guardrail-app:8000
      GUIDED_LAB05_URL: http://guided-h05-nemo-dialog:8000
      GUIDED_LAB06_URL: http://guided-h06-nemo-action:8000
      GUIDED_H06_PROVIDER_URL: http://guided-h06-action-provider:8000
      GUIDED_H21_HOST_URL: http://guided-h21-host:8000
      GUIDED_H22_HOST_URL: http://guided-h22-host:8000
      GUIDED_BEDROCK_GATEWAY_URL: http://guided-bedrock-gateway:8080
      GUIDED_VERIFIER_URL: http://guided-evidence-verifier:8000
      GUIDED_ALLOWED_HOSTS: 127.0.0.1:${GUIDED_HOST_PORT:-18097},localhost:${GUIDED_HOST_PORT:-18097}
      GUIDED_ALLOWED_ORIGINS: http://127.0.0.1:${GUIDED_HOST_PORT:-18097},http://localhost:${GUIDED_HOST_PORT:-18097}
      GUIDED_NEMO_BROWSER_URL: http://127.0.0.1:${GUIDED_NEMO_HOST_PORT:-18192}
    depends_on:
      guided-h01-gateway: {condition: service_healthy}
      guided-h02-document-app: {condition: service_healthy}
      guided-h03-sync-app: {condition: service_healthy}
      guided-h04-guardrail-app: {condition: service_healthy}
      guided-h05-nemo-dialog: {condition: service_healthy}
      guided-h06-nemo-action: {condition: service_healthy}
      guided-h06-action-provider: {condition: service_healthy}
      guided-h21-host: {condition: service_healthy}
      guided-h22-host: {condition: service_healthy}
      guided-evidence-verifier: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/readyz', headers={'Host':'127.0.0.1:${GUIDED_HOST_PORT:-18097}'}); urllib.request.urlopen(r, timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-h01-gateway:
    <<: *guided-service
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-labs/h01-bedrock-gateway/Containerfile
    image: localhost/llm-security-guided-h01-gateway:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h01-gateway
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REGION: us-east-1
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_SHARED_CREDENTIALS_FILE: /tmp/.aws/credentials
      AWS_CONFIG_FILE: /tmp/.aws/config
      GUIDED_PROVIDER_MODE: ${GUIDED_PROVIDER_MODE:-aws}
      GUIDED_CONTROL_LAB01_TOKEN: ${GUIDED_CONTROL_LAB01_TOKEN:?Set GUIDED_CONTROL_LAB01_TOKEN}
      GUIDED_VERIFIER_LAB01_TOKEN: ${GUIDED_VERIFIER_LAB01_TOKEN:?Set GUIDED_VERIFIER_LAB01_TOKEN}
    volumes:
      - ${AWS_CREDENTIALS_DIR:-${HOME}/.aws}:/tmp/.aws:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-evidence-verifier:
    <<: *guided-service
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-evidence-verifier/Containerfile
    image: localhost/llm-security-guided-evidence-verifier:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-evidence-verifier
    environment:
      GUIDED_CONTROL_VERIFIER_TOKEN: ${GUIDED_CONTROL_VERIFIER_TOKEN:?Set GUIDED_CONTROL_VERIFIER_TOKEN}
      GUIDED_VERIFIER_LAB01_TOKEN: ${GUIDED_VERIFIER_LAB01_TOKEN:?Set GUIDED_VERIFIER_LAB01_TOKEN}
      GUIDED_VERIFIER_LAB02_TOKEN: ${GUIDED_VERIFIER_LAB02_TOKEN:?Set GUIDED_VERIFIER_LAB02_TOKEN}
      GUIDED_VERIFIER_LAB03_TOKEN: ${GUIDED_VERIFIER_LAB03_TOKEN:?Set GUIDED_VERIFIER_LAB03_TOKEN}
      GUIDED_VERIFIER_LAB04_TOKEN: ${GUIDED_VERIFIER_LAB04_TOKEN:?Set GUIDED_VERIFIER_LAB04_TOKEN}
      GUIDED_VERIFIER_LAB05_TOKEN: ${GUIDED_VERIFIER_LAB05_TOKEN:?Set GUIDED_VERIFIER_LAB05_TOKEN}
      GUIDED_VERIFIER_LAB06_TOKEN: ${GUIDED_VERIFIER_LAB06_TOKEN:?Set GUIDED_VERIFIER_LAB06_TOKEN}
      GUIDED_H06_PROVIDER_VERIFIER_TOKEN: ${GUIDED_H06_PROVIDER_VERIFIER_TOKEN:?Set GUIDED_H06_PROVIDER_VERIFIER_TOKEN}
      GUIDED_VERIFIER_H21_TOKEN: ${GUIDED_VERIFIER_H21_TOKEN:?Set GUIDED_VERIFIER_H21_TOKEN}
      GUIDED_VERIFIER_H22_TOKEN: ${GUIDED_VERIFIER_H22_TOKEN:?Set GUIDED_VERIFIER_H22_TOKEN}
      GUIDED_VERIFIER_GATEWAY_TOKEN: ${GUIDED_VERIFIER_GATEWAY_TOKEN:?Set GUIDED_VERIFIER_GATEWAY_TOKEN}
      GUIDED_LAB01_URL: http://guided-h01-gateway:8000
      GUIDED_LAB02_URL: http://guided-h02-document-app:8000
      GUIDED_LAB03_URL: http://guided-h03-sync-app:8000
      GUIDED_LAB04_URL: http://guided-h04-guardrail-app:8000
      GUIDED_LAB05_URL: http://guided-h05-nemo-dialog:8000
      GUIDED_LAB06_URL: http://guided-h06-nemo-action:8000
      GUIDED_H06_PROVIDER_URL: http://guided-h06-action-provider:8000
      GUIDED_H21_HOST_URL: http://guided-h21-host:8000
      GUIDED_H21_PROVIDER_URL: http://guided-h21-provider:8000
      GUIDED_H21_TRUSTED_MCP_URL: http://guided-h21-trusted-mcp:8000/mcp
      GUIDED_H21_UNTRUSTED_MCP_URL: http://guided-h21-untrusted-mcp:8000/mcp
      GUIDED_H22_HOST_URL: http://guided-h22-host:8000
      GUIDED_H22_MCP_URL: http://guided-h22-mcp-server:8000/mcp
      GUIDED_BEDROCK_GATEWAY_URL: http://guided-bedrock-gateway:8080
    volumes: [guided-verifier-state:/state:rw]
    depends_on:
      guided-h01-gateway: {condition: service_healthy}
      guided-h02-document-app: {condition: service_healthy}
      guided-h03-sync-app: {condition: service_healthy}
      guided-h04-guardrail-app: {condition: service_healthy}
      guided-h05-nemo-dialog: {condition: service_healthy}
      guided-h06-nemo-action: {condition: service_healthy}
      guided-h06-action-provider: {condition: service_healthy}
      guided-h21-host: {condition: service_healthy}
      guided-h21-provider: {condition: service_healthy}
      guided-h21-trusted-mcp: {condition: service_healthy}
      guided-h21-untrusted-mcp: {condition: service_healthy}
      guided-h22-host: {condition: service_healthy}
      guided-h22-mcp-server: {condition: service_healthy}
      guided-bedrock-gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-bedrock-gateway:
    <<: *guided-service
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-bedrock-gateway/Containerfile
    image: localhost/llm-security-guided-bedrock-gateway:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-bedrock-gateway
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REGION: us-east-1
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_SHARED_CREDENTIALS_FILE: /tmp/.aws/credentials
      AWS_CONFIG_FILE: /tmp/.aws/config
      GUIDED_PROVIDER_MODE: ${GUIDED_PROVIDER_MODE:-aws}
      GUIDED_LAB01_GATEWAY_TOKEN: ${GUIDED_LAB01_GATEWAY_TOKEN:?Set GUIDED_LAB01_GATEWAY_TOKEN}
      GUIDED_NEMO_GATEWAY_TOKEN: ${GUIDED_NEMO_GATEWAY_TOKEN:?Set GUIDED_NEMO_GATEWAY_TOKEN}
      GUIDED_VERIFIER_GATEWAY_TOKEN: ${GUIDED_VERIFIER_GATEWAY_TOKEN:?Set GUIDED_VERIFIER_GATEWAY_TOKEN}
      GUIDED_H02_GATEWAY_TOKEN: ${GUIDED_H02_GATEWAY_TOKEN:?Set GUIDED_H02_GATEWAY_TOKEN}
      GUIDED_LAB02_PROVISION_TOKEN: ${GUIDED_LAB02_PROVISION_TOKEN:?Set GUIDED_LAB02_PROVISION_TOKEN}
      GUIDED_H03_GATEWAY_TOKEN: ${GUIDED_H03_GATEWAY_TOKEN:?Set GUIDED_H03_GATEWAY_TOKEN}
      GUIDED_LAB03_PROVISION_TOKEN: ${GUIDED_LAB03_PROVISION_TOKEN:?Set GUIDED_LAB03_PROVISION_TOKEN}
      GUIDED_H04_GATEWAY_TOKEN: ${GUIDED_H04_GATEWAY_TOKEN:?Set GUIDED_H04_GATEWAY_TOKEN}
      GUIDED_LAB04_PROVISION_TOKEN: ${GUIDED_LAB04_PROVISION_TOKEN:?Set GUIDED_LAB04_PROVISION_TOKEN}
    volumes:
      - ${AWS_CREDENTIALS_DIR:-${HOME}/.aws}:/tmp/.aws:ro
      - ../../llm-security-control-plane/.state/guided-gateway:/state:rw
    networks:
      guided:
        aliases: [llm-security-bedrock-gateway]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-h02-document-app:
    <<: *guided-service
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-labs/h02-document-ingestion/Containerfile
    image: localhost/llm-security-guided-h02-document-app:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h02-document-app
    environment:
      GUIDED_BEDROCK_GATEWAY_URL: http://guided-bedrock-gateway:8080
      GUIDED_H02_GATEWAY_TOKEN: ${GUIDED_H02_GATEWAY_TOKEN:?Set GUIDED_H02_GATEWAY_TOKEN}
      GUIDED_CONTROL_LAB02_TOKEN: ${GUIDED_CONTROL_LAB02_TOKEN:?Set GUIDED_CONTROL_LAB02_TOKEN}
      GUIDED_VERIFIER_LAB02_TOKEN: ${GUIDED_VERIFIER_LAB02_TOKEN:?Set GUIDED_VERIFIER_LAB02_TOKEN}
    depends_on:
      guided-bedrock-gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-h03-sync-app:
    <<: *guided-service
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-labs/h03-ingestion-search/Containerfile
    image: localhost/llm-security-guided-h03-sync-app:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h03-sync-app
    environment:
      GUIDED_BEDROCK_GATEWAY_URL: http://guided-bedrock-gateway:8080
      GUIDED_H03_GATEWAY_TOKEN: ${GUIDED_H03_GATEWAY_TOKEN:?Set GUIDED_H03_GATEWAY_TOKEN}
      GUIDED_CONTROL_LAB03_TOKEN: ${GUIDED_CONTROL_LAB03_TOKEN:?Set GUIDED_CONTROL_LAB03_TOKEN}
      GUIDED_VERIFIER_LAB03_TOKEN: ${GUIDED_VERIFIER_LAB03_TOKEN:?Set GUIDED_VERIFIER_LAB03_TOKEN}
    depends_on:
      guided-bedrock-gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-h04-guardrail-app:
    <<: *guided-service
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-labs/h04-bedrock-guardrail/Containerfile
    image: localhost/llm-security-guided-h04-guardrail-app:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h04-guardrail-app
    environment:
      GUIDED_BEDROCK_GATEWAY_URL: http://guided-bedrock-gateway:8080
      GUIDED_H04_GATEWAY_TOKEN: ${GUIDED_H04_GATEWAY_TOKEN:?Set GUIDED_H04_GATEWAY_TOKEN}
      GUIDED_CONTROL_LAB04_TOKEN: ${GUIDED_CONTROL_LAB04_TOKEN:?Set GUIDED_CONTROL_LAB04_TOKEN}
      GUIDED_VERIFIER_LAB04_TOKEN: ${GUIDED_VERIFIER_LAB04_TOKEN:?Set GUIDED_VERIFIER_LAB04_TOKEN}
    depends_on:
      guided-bedrock-gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-h05-nemo-dialog:
    <<: *guided-service
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-labs/h05-nemo-dialog/Containerfile
    image: localhost/llm-security-guided-h05-nemo-dialog:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h05-nemo-dialog
    environment:
      OPENAI_API_KEY: dialog-rails-do-not-call-a-model
      GUIDED_CONTROL_LAB05_TOKEN: ${GUIDED_CONTROL_LAB05_TOKEN:?Set GUIDED_CONTROL_LAB05_TOKEN}
      GUIDED_VERIFIER_LAB05_TOKEN: ${GUIDED_VERIFIER_LAB05_TOKEN:?Set GUIDED_VERIFIER_LAB05_TOKEN}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 45

  guided-h06-action-provider:
    <<: *guided-service
    tmpfs: ["/state:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0700"]
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-labs/h06-action-provider/Containerfile
    image: localhost/llm-security-guided-h06-action-provider:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h06-action-provider
    environment:
      GUIDED_H06_PROVIDER_CONTROL_TOKEN: ${GUIDED_H06_PROVIDER_CONTROL_TOKEN:?Set GUIDED_H06_PROVIDER_CONTROL_TOKEN}
      GUIDED_H06_PROVIDER_ACTION_TOKEN: ${GUIDED_H06_PROVIDER_ACTION_TOKEN:?Set GUIDED_H06_PROVIDER_ACTION_TOKEN}
      GUIDED_H06_PROVIDER_VERIFIER_TOKEN: ${GUIDED_H06_PROVIDER_VERIFIER_TOKEN:?Set GUIDED_H06_PROVIDER_VERIFIER_TOKEN}
      GUIDED_H06_CAPABILITY_SECRET: ${GUIDED_H06_CAPABILITY_SECRET:?Set GUIDED_H06_CAPABILITY_SECRET}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-h06-nemo-action:
    <<: *guided-service
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-labs/h06-nemo-action/Containerfile
    image: localhost/llm-security-guided-h06-nemo-action:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h06-nemo-action
    environment:
      OPENAI_API_KEY: dialog-rails-do-not-call-a-model
      GUIDED_CONTROL_LAB06_TOKEN: ${GUIDED_CONTROL_LAB06_TOKEN:?Set GUIDED_CONTROL_LAB06_TOKEN}
      GUIDED_VERIFIER_LAB06_TOKEN: ${GUIDED_VERIFIER_LAB06_TOKEN:?Set GUIDED_VERIFIER_LAB06_TOKEN}
      GUIDED_H06_PROVIDER_ACTION_TOKEN: ${GUIDED_H06_PROVIDER_ACTION_TOKEN:?Set GUIDED_H06_PROVIDER_ACTION_TOKEN}
      GUIDED_H06_PROVIDER_URL: http://guided-h06-action-provider:8000
    depends_on:
      guided-h06-action-provider: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 45

  guided-h22-mcp-server:
    <<: *guided-service
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /state:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0700
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-labs/h22-mcp-approval/Containerfile
    image: localhost/llm-security-guided-h22-mcp:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h22-mcp-server
    command: [python, /app/server.py]
    environment:
      GUIDED_H22_APPROVAL_SECRET: ${GUIDED_H22_APPROVAL_SECRET:?Set GUIDED_H22_APPROVAL_SECRET}
    healthcheck:
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-h21-provider:
    <<: *guided-service
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-labs/h21-agent-policy/Containerfile
    image: localhost/llm-security-guided-h21-agent:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h21-provider
    command: [uvicorn, provider:app, --host, 0.0.0.0, --port, "8000", --log-level, warning]
    environment:
      GUIDED_H21_PROVIDER_TOKEN: ${GUIDED_H21_PROVIDER_TOKEN:?Set GUIDED_H21_PROVIDER_TOKEN}
      GUIDED_VERIFIER_H21_TOKEN: ${GUIDED_VERIFIER_H21_TOKEN:?Set GUIDED_VERIFIER_H21_TOKEN}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-h21-trusted-mcp:
    <<: *guided-service
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-labs/h21-agent-policy/Containerfile
    image: localhost/llm-security-guided-h21-agent:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h21-trusted-mcp
    command: [python, /app/mcp_server.py]
    environment:
      GUIDED_H21_SERVER_ID: training-notice-mcp
      GUIDED_H21_SERVICE_HOST: guided-h21-trusted-mcp
      GUIDED_H21_OAUTH_SECRET: ${GUIDED_H21_OAUTH_SECRET:?Set GUIDED_H21_OAUTH_SECRET}
      GUIDED_VERIFIER_H21_TOKEN: ${GUIDED_VERIFIER_H21_TOKEN:?Set GUIDED_VERIFIER_H21_TOKEN}
    healthcheck:
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-h21-untrusted-mcp:
    <<: *guided-service
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-labs/h21-agent-policy/Containerfile
    image: localhost/llm-security-guided-h21-agent:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h21-untrusted-mcp
    command: [python, /app/mcp_server.py]
    environment:
      GUIDED_H21_SERVER_ID: untrusted-notice-mcp
      GUIDED_H21_SERVICE_HOST: guided-h21-untrusted-mcp
      GUIDED_H21_OAUTH_SECRET: ${GUIDED_H21_OAUTH_SECRET:?Set GUIDED_H21_OAUTH_SECRET}
      GUIDED_VERIFIER_H21_TOKEN: ${GUIDED_VERIFIER_H21_TOKEN:?Set GUIDED_VERIFIER_H21_TOKEN}
    healthcheck:
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-h21-host:
    <<: *guided-service
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-labs/h21-agent-policy/Containerfile
    image: localhost/llm-security-guided-h21-agent:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h21-host
    command: [uvicorn, host:app, --host, 0.0.0.0, --port, "8000", --log-level, warning]
    environment:
      GUIDED_CONTROL_H21_TOKEN: ${GUIDED_CONTROL_H21_TOKEN:?Set GUIDED_CONTROL_H21_TOKEN}
      GUIDED_VERIFIER_H21_TOKEN: ${GUIDED_VERIFIER_H21_TOKEN:?Set GUIDED_VERIFIER_H21_TOKEN}
      GUIDED_H21_PROVIDER_TOKEN: ${GUIDED_H21_PROVIDER_TOKEN:?Set GUIDED_H21_PROVIDER_TOKEN}
      GUIDED_H21_OAUTH_SECRET: ${GUIDED_H21_OAUTH_SECRET:?Set GUIDED_H21_OAUTH_SECRET}
      GUIDED_H21_PROVIDER_URL: http://guided-h21-provider:8000
      GUIDED_H21_TRUSTED_MCP_URL: http://guided-h21-trusted-mcp:8000/mcp
      GUIDED_H21_UNTRUSTED_MCP_URL: http://guided-h21-untrusted-mcp:8000/mcp
    depends_on:
      guided-h21-provider: {condition: service_healthy}
      guided-h21-trusted-mcp: {condition: service_healthy}
      guided-h21-untrusted-mcp: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-h22-host:
    <<: *guided-service
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /state:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0700
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-labs/h22-mcp-approval/Containerfile
    image: localhost/llm-security-guided-h22-mcp:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h22-host
    command: [uvicorn, host:app, --host, 0.0.0.0, --port, "8000", --log-level, warning]
    environment:
      GUIDED_H22_MCP_URL: http://guided-h22-mcp-server:8000/mcp
      GUIDED_H22_APPROVAL_SECRET: ${GUIDED_H22_APPROVAL_SECRET:?Set GUIDED_H22_APPROVAL_SECRET}
      GUIDED_CONTROL_H22_TOKEN: ${GUIDED_CONTROL_H22_TOKEN:?Set GUIDED_CONTROL_H22_TOKEN}
      GUIDED_VERIFIER_H22_TOKEN: ${GUIDED_VERIFIER_H22_TOKEN:?Set GUIDED_VERIFIER_H22_TOKEN}
    depends_on:
      guided-h22-mcp-server: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-nemo-ui:
    <<: *guided-service
    build:
      context: ../../llm-security-control-plane
      dockerfile: official-uis/nemo/Containerfile
    image: localhost/llm-security-nemo-official-ui:0.22.0
    container_name: llm-security-guided-nemo-ui
    environment:
      BEDROCK_GATEWAY_TOKEN: ${GUIDED_NEMO_GATEWAY_TOKEN:?Set GUIDED_NEMO_GATEWAY_TOKEN}
    depends_on:
      guided-bedrock-gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/rails/configs', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 45

networks:
  guided: {name: llm-security-guided}

volumes:
  guided-verifier-state:
