name: llm-security-guided-course

x-guided-service: &guided-service
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
  networks: [guided]

services:
  guided-front-proxy:
    <<: *guided-service
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0700
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-front-proxy/Containerfile
    image: localhost/llm-security-guided-front-proxy:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-front-proxy
    depends_on:
      guided-control-center: {condition: service_healthy}
    ports:
      - 127.0.0.1:${GUIDED_HOST_PORT:-28097}:18097
      - 127.0.0.1:${GUIDED_NEMO_HOST_PORT:-28192}:18192
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:18097/proxy-healthz]
      interval: 2s
      timeout: 2s
      retries: 30

  guided-control-center:
    <<: *guided-service
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-control-center/Containerfile
      args: {APP_VERSION: "${GUIDED_IMAGE_VERSION:-0.1.0}"}
    image: localhost/llm-security-guided-control-center:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-control-center
    environment:
      RELEASE_VERSION: ${GUIDED_IMAGE_VERSION:-0.1.0}
      GUIDED_SESSION_SECRET: ${GUIDED_SESSION_SECRET:?Set GUIDED_SESSION_SECRET}
      GUIDED_CONTROL_LAB01_TOKEN: ${GUIDED_CONTROL_LAB01_TOKEN:?Set GUIDED_CONTROL_LAB01_TOKEN}
      GUIDED_CONTROL_LAB02_TOKEN: ${GUIDED_CONTROL_LAB02_TOKEN:?Set GUIDED_CONTROL_LAB02_TOKEN}
