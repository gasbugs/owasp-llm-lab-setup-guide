      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REGION: us-east-1
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_SHARED_CREDENTIALS_FILE: /tmp/.aws/credentials
