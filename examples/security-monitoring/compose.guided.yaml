    command: [python, /app/mcp_server.py]
    environment:
      GUIDED_H21_SERVER_ID: training-notice-mcp
      GUIDED_H21_SERVICE_HOST: guided-h21-trusted-mcp
      GUIDED_H21_OAUTH_SECRET: ${GUIDED_H21_OAUTH_SECRET:?Set GUIDED_H21_OAUTH_SECRET}
      GUIDED_VERIFIER_H21_TOKEN: ${GUIDED_VERIFIER_H21_TOKEN:?Set GUIDED_VERIFIER_H21_TOKEN}
    healthcheck:
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 30

  guided-h21-untrusted-mcp:
