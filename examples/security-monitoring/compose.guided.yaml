    image: localhost/llm-security-guided-h21-agent:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h21-host
    command: [uvicorn, host:app, --host, 0.0.0.0, --port, "8000", --log-level, warning]
    environment:
      GUIDED_CONTROL_H21_TOKEN: ${GUIDED_CONTROL_H21_TOKEN:?Set GUIDED_CONTROL_H21_TOKEN}
      GUIDED_VERIFIER_H21_TOKEN: ${GUIDED_VERIFIER_H21_TOKEN:?Set GUIDED_VERIFIER_H21_TOKEN}
      GUIDED_H21_PROVIDER_TOKEN: ${GUIDED_H21_PROVIDER_TOKEN:?Set GUIDED_H21_PROVIDER_TOKEN}
      GUIDED_H21_OAUTH_SECRET: ${GUIDED_H21_OAUTH_SECRET:?Set GUIDED_H21_OAUTH_SECRET}
