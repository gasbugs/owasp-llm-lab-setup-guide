      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    volumes: [guided-h18-query-state:/state:rw]
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"], interval: 2s, timeout: 3s, retries: 30}

  guided-alloy:
    image: docker.io/grafana/alloy:v1.18.0
    container_name: llm-security-guided-alloy
    command: [run, --server.http.listen-addr=0.0.0.0:12345, /etc/alloy/config.alloy]
    volumes: [./alloy/config.alloy:/etc/alloy/config.alloy:ro, guided-alloy-data:/var/lib/alloy/data]
    networks: {guided: {aliases: [alloy]}}
    depends_on: {guided-loki: {condition: service_healthy}, guided-tempo: {condition: service_healthy}}

  guided-loki:
    image: docker.io/grafana/loki:3.5.3
    container_name: llm-security-guided-loki
    command: [-config.file=/etc/loki/config.yaml]
    volumes: [./loki-config.yaml:/etc/loki/config.yaml:ro, guided-loki-data:/loki]
    networks: {guided: {aliases: [loki]}}
    healthcheck: {test: [CMD, /usr/bin/loki, -version], interval: 3s, timeout: 3s, retries: 40}

  guided-tempo:
    image: docker.io/grafana/tempo:3.0.2
    container_name: llm-security-guided-tempo
    command: [-target=all, -config.file=/etc/tempo/config.yaml]
    volumes: [./tempo.yaml:/etc/tempo/config.yaml:ro, guided-tempo-data:/var/tempo]
    networks: {guided: {aliases: [tempo]}}
    healthcheck: {test: [CMD, /tempo, -version], interval: 3s, timeout: 3s, retries: 40}

  guided-prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    container_name: llm-security-guided-prometheus
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --web.enable-lifecycle]
    volumes: [../../llm-security-control-plane/guided-labs/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro, guided-prometheus-data:/prometheus]
    networks: {guided: {aliases: [prometheus]}}
    depends_on: {guided-alertmanager: {condition: service_started}}
    healthcheck: {test: [CMD, wget, -q, -O-, http://127.0.0.1:9090/-/ready], interval: 3s, timeout: 3s, retries: 40}

  guided-alertmanager:
    image: docker.io/prom/alertmanager:v0.28.1
    container_name: llm-security-guided-alertmanager
    command: [--config.file=/etc/alertmanager/alertmanager.yml]
    volumes: [../../llm-security-control-plane/guided-labs/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro, guided-alertmanager-data:/alertmanager]
    networks: {guided: {aliases: [alertmanager]}}

  guided-grafana:
    image: docker.io/grafana/grafana:12.1.0
    container_name: llm-security-guided-grafana
    environment: {GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: "${GUIDED_GRAFANA_PASSWORD:?Set GUIDED_GRAFANA_PASSWORD}", GF_AUTH_ANONYMOUS_ENABLED: "false"}
    ports: ["127.0.0.1:${GUIDED_GRAFANA_PORT:-23001}:3000"]
    volumes: [../../llm-security-control-plane/guided-labs/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/guided.yml:ro, guided-grafana-data:/var/lib/grafana]
    networks: {guided: {aliases: [grafana]}}
    depends_on: {guided-prometheus: {condition: service_healthy}, guided-loki: {condition: service_healthy}, guided-tempo: {condition: service_healthy}}

  guided-h22-mcp-server:
    <<: *guided-service
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /state:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0700
    build:
      context: ../../llm-security-control-plane
      dockerfile: guided-labs/h22-mcp-approval/Containerfile
    image: localhost/llm-security-guided-h22-mcp:${GUIDED_IMAGE_VERSION:-0.1.0}
    container_name: llm-security-guided-h22-mcp-server
    command: [python, /app/server.py]
    environment:
      GUIDED_H22_APPROVAL_SECRET: ${GUIDED_H22_APPROVAL_SECRET:?Set GUIDED_H22_APPROVAL_SECRET}
    healthcheck:
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
