apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: llm-security-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    type: loki
    uid: llm-security-loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([a-f0-9]{32})"'
          datasourceUid: llm-security-tempo
          url: '$${__value.raw}'
  - name: Tempo
    type: tempo
    uid: llm-security-tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: llm-security-loki
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        filterByTraceID: true
        filterBySpanID: false
      serviceMap:
        datasourceUid: llm-security-prometheus
  - name: Alertmanager
    type: alertmanager
    uid: llm-security-alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
