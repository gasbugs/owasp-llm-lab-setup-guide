name: ${COMPOSE_PROJECT_NAME:-llm-security-observability}

services:
  gateway:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/llm-security-gateway:3.0
    container_name: ${CONTAINER_NAME_PREFIX:-llm-sec}-gateway
    environment:
      ENABLE_LAB_ENDPOINTS: "true"
      LLM_MONITOR_TOKEN: ${LLM_MONITOR_TOKEN:?Use the generated Module 08 Compose env file}
      LLM_MONITOR_ADMIN_TOKEN: ${LLM_MONITOR_ADMIN_TOKEN:?Use the generated Module 08 Compose env file}
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN:?Use the generated Module 08 Compose env file}
      TELEMETRY_HMAC_KEY: ${TELEMETRY_HMAC_KEY:?Use the generated Module 08 Compose env file}
      BEDROCK_GATEWAY_URL: ${BEDROCK_GATEWAY_URL:-http://llm-security-bedrock-gateway:8080}
      BEDROCK_GATEWAY_TOKEN: ${BEDROCK_GATEWAY_TOKEN:?Use the generated Module 08 Compose env file}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.amazon.nova-lite-v1:0}
      RETRIEVAL_URL: http://retrieval:8081
      RETRIEVAL_SERVICE_TOKEN: ${RETRIEVAL_SERVICE_TOKEN:?Use the generated Module 08 Compose env file}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      SECURITY_EVENT_DB: /data/security-events.db
      SECURITY_POLICY_PATH: /app/policy.json
    ports:
      - 127.0.0.1:${MONITOR_HOST_PORT:-8014}:8080
    volumes:
      - ${MONITOR_POLICY_PATH:-./policy.json}:/app/policy.json:ro
      - gateway-events:/data
    networks: [observability]
    security_opt: [no-new-privileges]

  retrieval:
    image: localhost/llm-security-gateway:3.0
    container_name: ${CONTAINER_NAME_PREFIX:-llm-sec}-retrieval
    command: ["uvicorn", "retrieval_service:app", "--host", "0.0.0.0", "--port", "8081", "--no-access-log"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      RETRIEVAL_SERVICE_TOKEN: ${RETRIEVAL_SERVICE_TOKEN:?Use the generated Module 08 Compose env file}
    ports:
      - 127.0.0.1:${RETRIEVAL_HOST_PORT:-8015}:8081
    networks: [observability]
    security_opt: [no-new-privileges]

  alloy:
    image: docker.io/grafana/alloy:v1.18.0
    container_name: ${CONTAINER_NAME_PREFIX:-llm-sec}-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    ports:
      - 127.0.0.1:${ALLOY_HOST_PORT:-12345}:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    networks: [observability]
    security_opt: [no-new-privileges]

  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    container_name: ${CONTAINER_NAME_PREFIX:-llm-sec}-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage
    ports:
      - 127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090
    volumes:
      - ${PROMETHEUS_CONFIG_SOURCE:-./prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ${PROMETHEUS_RULES_SOURCE:-./alert-rules.yml}:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    networks: [observability]
    security_opt: [no-new-privileges]

  alertmanager:
    image: docker.io/prom/alertmanager:v0.28.1
    container_name: ${CONTAINER_NAME_PREFIX:-llm-sec}-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    ports:
      - 127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [observability]
    security_opt: [no-new-privileges]

  alert-webhook:
    image: localhost/llm-security-gateway:3.0
    container_name: ${CONTAINER_NAME_PREFIX:-llm-sec}-alert-webhook
    command: ["uvicorn", "alert_receiver:app", "--host", "0.0.0.0", "--port", "8099", "--no-access-log"]
    ports:
      - 127.0.0.1:${WEBHOOK_HOST_PORT:-8099}:8099
    networks: [observability]
    security_opt: [no-new-privileges]

  loki:
    image: docker.io/grafana/loki:3.5.3
    container_name: ${CONTAINER_NAME_PREFIX:-llm-sec}-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - 127.0.0.1:${LOKI_HOST_PORT:-3100}:3100
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [observability]
    security_opt: [no-new-privileges]

  tempo:
    image: docker.io/grafana/tempo:3.0.2
    container_name: ${CONTAINER_NAME_PREFIX:-llm-sec}-tempo
    command: ["-target=all", "-config.file=/etc/tempo/config.yaml"]
    ports:
      - 127.0.0.1:${TEMPO_HOST_PORT:-3200}:3200
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    networks: [observability]
    security_opt: [no-new-privileges]

  grafana:
    image: docker.io/grafana/grafana:12.1.0
    container_name: ${CONTAINER_NAME_PREFIX:-llm-sec}-grafana
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Use the generated Module 08 Compose env file}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Use the generated Module 08 Compose env file}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    ports:
      - 127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [observability]
    security_opt: [no-new-privileges]

networks:
  observability:
    name: ${OBSERVABILITY_NETWORK_NAME:-llm-security-observability}

volumes:
  gateway-events:
  alloy-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  grafana-data:
