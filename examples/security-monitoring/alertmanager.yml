route:
  receiver: lab-webhook
  group_by: [alertname, severity]
  group_wait: 1s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: lab-webhook
    webhook_configs:
      - url: http://alert-webhook:8099/api/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname]
