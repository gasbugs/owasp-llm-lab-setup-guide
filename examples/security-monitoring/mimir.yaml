target: all
multitenancy_enabled: false

server:
  http_listen_port: 9009
  log_level: info

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  tsdb:
    dir: /data/tsdb
    retention_period: 24h
  bucket_store:
    sync_dir: /data/tsdb-sync

compactor:
  data_dir: /data/compactor

ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: inmemory

ruler:
  enable_api: true
  rule_path: /data/ruler

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/rules

alertmanager:
  data_dir: /data/alertmanager
  enable_api: true

alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /data/alertmanager-store

limits:
  compactor_blocks_retention_period: 24h

usage_stats:
  enabled: false
