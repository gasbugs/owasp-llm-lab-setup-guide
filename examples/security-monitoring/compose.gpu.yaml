services:
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless
    container_name: llm-sec-dcgm
    devices:
      - nvidia.com/gpu=all
    environment:
      DCGM_EXPORTER_LISTEN: :9400
      DCGM_EXPORTER_KUBERNETES: "false"
    ports:
      - 127.0.0.1:9400:9400
    networks: [observability]
