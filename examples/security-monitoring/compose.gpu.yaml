services:
  gpu-exporter:
    image: localhost/llm-security-gateway:3.0
    container_name: llm-sec-gpu-exporter
    command: ["python", "/app/gpu_exporter.py"]
    devices:
      - nvidia.com/gpu=all
    ports:
      - 0.0.0.0:9400:9400
    networks: [observability]
    security_opt: [no-new-privileges]
