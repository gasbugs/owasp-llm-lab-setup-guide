# CUSTOM FILE: LLMGoat 로컬 Build·배포용 Compose
# Format: https://docs.docker.com/reference/compose-file/
# License: GPL-3.0

name: llmgoat-local-build

services:
  llmgoat:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/llmgoat-local-build:v0.1.0
    container_name: llmgoat-local-build
    restart: unless-stopped
    gpus: all
    ports:
      # 기존 교재의 5000번 포트와 겹치지 않도록 Host에서는 15000번을 사용한다.
      - "15000:5000"
    environment:
      LLMGOAT_SERVER_HOST: 0.0.0.0
      LLMGOAT_SERVER_PORT: "5000"
      LLMGOAT_DEFAULT_MODEL: gemma-2.gguf
      LLMGOAT_N_GPU_LAYERS: "20"
      LLMGOAT_N_THREADS: "4"
      LLMGOAT_VERBOSE: "1"
    volumes:
      # 모델과 cache는 컨테이너를 다시 만들어도 재사용한다.
      - llmgoat-local-models:/root/.LLMGoat/models
      - llmgoat-local-cache:/root/.LLMGoat/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/api/model_status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 10m

volumes:
  llmgoat-local-models:
  llmgoat-local-cache:
