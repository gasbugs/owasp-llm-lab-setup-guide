models:
  - type: main
    engine: openai
    model: us.amazon.nova-lite-v1:0#h07-main
    parameters:
      temperature: 0.0
      max_tokens: 120

  - type: content_safety
    engine: openai
    model: us.amazon.nova-lite-v1:0#h07-content-safety
    parameters:
      temperature: 0.0
      max_tokens: 120

rails:
  input:
    flows:
      - content safety check input $model=content_safety
