# CUSTOM FILE: P20-only infrastructure; learner edits rules.yaml.
# Format: https://prometheus.io/docs/prometheus/latest/configuration/configuration/ · Apache-2.0
global:
  scrape_interval: 1s
  evaluation_interval: 1s
rule_files: [/etc/prometheus/p20-rules.yml]
scrape_configs:
  - job_name: p20
    static_configs:
      - targets: [guided-h20-alerts:8000]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [guided-h20-alertmanager:9093]
