# CUSTOM FILE
# Format reference: https://docs.nvidia.com/nemo/guardrails/latest/configure-rails/configuration-guide.html
# Upstream format license: Apache-2.0

models:
  - type: main
    engine: openai
    model: us.amazon.nova-lite-v1:0

rails:
  dialog:
    user_messages:
      embeddings_only: true
      embeddings_only_similarity_threshold: 0.45
      embeddings_only_fallback_intent: unsupported request

core:
  embedding_search_provider:
    name: default
    parameters:
      embedding_engine: FastEmbed
      embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      embedding_parameters:
        cache_dir: /opt/nemo-cache
        local_files_only: true
