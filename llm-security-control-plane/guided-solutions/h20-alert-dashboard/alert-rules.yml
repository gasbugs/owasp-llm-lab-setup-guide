# CUSTOM FILE
# Format reference: https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/
# Upstream format license: Apache-2.0
groups:
  - name: h20
    rules:
      - alert: GuidedH20BlockedRequest
        expr: guided_h20_risk_active == 1
        for: 2s
        labels: {severity: warning, hands_on: H20}
