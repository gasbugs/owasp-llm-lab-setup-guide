schema_version: 1

# 교육 전용 평문 계정이다. 실제 서비스에서는 외부 IdP와 비밀번호 해시 저장소를 사용한다.
users:
  public-reader:
    password: public-reader-demo
    roles: [public_reader]
    allowed_classifications: [public]
    allowed_purposes: [public_information]
  internal-analyst:
    password: internal-analyst-demo
    roles: [internal_analyst]
    allowed_classifications: [public, internal]
    allowed_purposes: [public_information, incident_response]
  support-agent:
    password: support-agent-demo
    roles: [support_agent]
    allowed_classifications: [public, internal, restricted]
    allowed_purposes: [public_information, incident_response, customer_support]

