# CUSTOM FILE: this project’s Application data-boundary policy; not an industry standard.
# It is project-authored YAML and is enforced by the Application server.
schema_version: 1
policy_id: application-data-boundary-v1

# 처음 읽는 순서
# 1. classifications: 데이터 등급마다 누가(Role), 어떤 업무 목적(Purpose)으로 읽을 수 있는지 본다.
# 2. security_ownership: 그 판단을 Application·NeMo·Presidio 중 누가 집행하는지 본다.
# Role은 사용자의 권한 묶음, Purpose는 요청의 업무 목적, Classification은 데이터 민감도다.
# 예: public_reader가 restricted 데이터를 요청하면 모델 호출 전에 Application이 거부한다.

# 데이터 등급마다 필요한 역할과 사용 목적을 함께 만족해야 한다.
# LLM이나 Guardrail의 자연어 판단으로 이 표를 우회하지 않는다.
classifications:
  public:
    required_roles: [public_reader, internal_analyst, support_agent]
    allowed_purposes: [public_information, incident_response, customer_support]
  internal:
    required_roles: [internal_analyst, support_agent]
    allowed_purposes: [incident_response, customer_support]
  restricted:
    required_roles: [support_agent]
    allowed_purposes: [customer_support]
  prohibited:
    # 금지 데이터는 저장과 모델 전송을 모두 허용하지 않는다.
    storage: forbidden
    model_transmission: forbidden

# 각 보안 결정을 어느 계층이 소유하는지 고정한다.
# 특히 인증·인가와 최종 집행은 Application 책임이다.
security_ownership:
  application:
    - authentication
    - authorization
    - classification
    - rag_store_selection
    - tenant_filter
    - final_response_enforcement
  nemo_hub:
    - guardrail_stage_order
    - guardrail_mode
    - main_model_invocation
  presidio_spoke:
    - pii_detection
    - sanitized_candidate_generation
