# CUSTOM FILE
# Format reference: nginx configuration, https://nginx.org/en/docs/
# Upstream license: BSD-2-Clause

worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # 개별 서비스만 재생성해 IP가 바뀌어도 Docker DNS에서 새 주소를 확인한다.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream guided_control_center_backend {
    zone guided_control_center_backend 64k;
    server guided-control-center:8000 resolve;
  }
  upstream guided_nemo_ui_backend {
    zone guided_nemo_ui_backend 64k;
    server guided-nemo-ui:8000 resolve;
  }

  server {
    listen 18097;
    server_name 127.0.0.1 localhost;

    if ($host !~ ^(127\.0\.0\.1|localhost)$) { return 421; }

    location = /proxy-healthz {
      access_log off;
      return 200 'front-proxy-ready';
      add_header Content-Type text/plain;
    }

    location / {
      proxy_pass http://guided_control_center_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Port 18097;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 18192;
    server_name 127.0.0.1 localhost;

    if ($host !~ ^(127\.0\.0\.1|localhost)$) { return 421; }

    location / {
      proxy_pass http://guided_nemo_ui_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Port 18192;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect http://guided-nemo-ui:8000/ /;
    }
  }
}
