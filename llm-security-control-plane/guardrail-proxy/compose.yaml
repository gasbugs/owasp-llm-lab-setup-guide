# CUSTOM FILE: product-local Docker Compose configuration.
# Format: https://docs.docker.com/reference/compose-file/ (Apache-2.0).
name: llm-security-guardrail-proxy
services:
  gateway:
    image: localhost/llm-security-guardrail-proxy-gateway:0.1.0
    build:
      context: ..
      dockerfile: bedrock-gateway/Containerfile
    user: ${LOCAL_UID:?required}:${LOCAL_GID:?required}
    environment:
      BEDROCK_GATEWAY_TOKEN: ${PROXY_GATEWAY_TOKEN:?required}
      AWS_PROFILE: default
      AWS_REGION: us-east-1
      BEDROCK_MODEL_ID: us.amazon.nova-lite-v1:0
    volumes:
      - ${HOME}/.aws:/tmp/.aws:ro
    networks: [private, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3))['ok']"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
  privacy:
    image: localhost/llm-security-guardrail-proxy-privacy:0.1.0
    build:
      context: ..
      dockerfile: spokes/presidio-privacy/Containerfile
    environment:
      PRESIDIO_INTERNAL_TOKEN: ${PROXY_PRIVACY_TOKEN:?required}
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8013/healthz', timeout=3))['ok']"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
  proxy:
    image: localhost/llm-security-guardrail-proxy-api:0.1.0
    build:
      context: ..
      dockerfile: guardrail-proxy/Containerfile
    environment:
      PROXY_CALLER_TOKEN: ${PROXY_CALLER_TOKEN:?required}
      PROXY_ADMIN_TOKEN: ${PROXY_ADMIN_TOKEN:?required}
      PROXY_GATEWAY_TOKEN: ${PROXY_GATEWAY_TOKEN:?required}
      PROXY_PRIVACY_TOKEN: ${PROXY_PRIVACY_TOKEN:?required}
      GATEWAY_URL: http://gateway:8080
      PRIVACY_URL: http://privacy:8013
    volumes:
      - policy_state:/state
    ports:
      - 127.0.0.1:28906:8000
    networks: [private, ingress]
    depends_on:
      gateway: {condition: service_healthy}
      privacy: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3))['ok']"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
networks:
  private: {internal: true}
  egress: {}
  ingress: {}
volumes:
  policy_state: {}
