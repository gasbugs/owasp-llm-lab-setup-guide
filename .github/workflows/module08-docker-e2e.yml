name: Module 08 Docker E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "llm-security-control-plane/**"
      - "tests/browser/**"
      - ".github/workflows/module08-docker-e2e.yml"

permissions:
  contents: read

jobs:
  docker-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Confirm Docker Engine and install jq
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq
          docker version
          docker compose version
          python -m pip install --requirement tests/browser/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build the real control-plane images
        run: |
          bash llm-security-control-plane/deploy/build-images.sh
          docker build -f examples/day6/nemo-guardrails/Containerfile \
            -t localhost/llm-security-nemo-dialog-rails:0.22.0 \
            examples/day6/nemo-guardrails
          docker build -f examples/day6/presidio/Containerfile \
            -t localhost/day6-presidio:2.2.362 \
            examples/day6/presidio

      - name: Run the progressive learner sequence
        run: bash llm-security-control-plane/tests/e2e-learning-sequence.sh

      - name: Run learner-authored first-tool tutorials
        run: bash llm-security-control-plane/tests/e2e-first-tool-tutorials.sh

      - name: Run the deterministic PyRIT adaptive-turn contract
        run: bash llm-security-control-plane/tests/e2e-pyrit-contract.sh

      - name: Smoke-test the real Bedrock Gateway entrypoint imports
        run: |
          docker run --rm --network none \
            --entrypoint python \
            --env AWS_EC2_METADATA_DISABLED=true \
            --env AWS_ACCESS_KEY_ID=test \
            --env AWS_SECRET_ACCESS_KEY=test \
            --env AWS_REGION=us-east-1 \
            --env BEDROCK_GATEWAY_TOKEN=e2e-bedrock-token \
            localhost/llm-security-bedrock-gateway:1.0.0 \
            -c 'import httpx; import telemetry; import server; print("real-bedrock-gateway-import=PASS")'

      - name: Start the deterministic Bedrock contract gateway
        run: |
          docker network create llm-security-control-plane
          docker run --detach --name module08-bedrock-contract \
            --network llm-security-control-plane \
            --publish 18097:8080 \
            --env BEDROCK_GATEWAY_TOKEN=e2e-bedrock-token \
            --volume "$PWD/llm-security-control-plane/tests/fake_bedrock_gateway.py:/app/server.py:ro" \
            docker.io/library/python:3.12-slim python /app/server.py

      - name: Run the complete control-plane E2E without intermediate errors
        env:
          MODEL_PROVIDER: amazon-bedrock
          BEDROCK_MODEL_ID: us.amazon.nova-lite-v1:0
          MODEL_GATEWAY_URL: http://module08-bedrock-contract:8080
          BEDROCK_GATEWAY_TEST_URL: http://127.0.0.1:18097
          START_BEDROCK_GATEWAY: "false"
          KEEP_CONTROL_PLANE: "true"
        run: |
          set -o pipefail
          bash llm-security-control-plane/tests/e2e-control-plane.sh 2>&1 | tee /tmp/module08-e2e.log
          ! grep -E '(^|[[:space:]])(Error:|INFRA:|Traceback|curl:)|service did not become ready' /tmp/module08-e2e.log

      - name: Run the deterministic Control Center browser contract
        # e2e-control-plane.sh deliberately publishes its isolated Application on
        # 28095, not the learner runtime's canonical 18095 port.
        run: >-
          python tests/browser/run_control_plane_ui.py
          --url http://127.0.0.1:28095
          --browser-channel chromium

      - name: Preserve Docker diagnostics on failure
        if: failure()
        run: |
          docker ps --all
          docker logs module08-bedrock-contract || true
          docker logs llm-security-presidio-spoke || true
          docker logs llm-security-nemo-hub || true
          docker logs llm-security-application-gateway || true

      - name: Remove test resources
        if: always()
        run: |
          docker rm --force module08-bedrock-contract \
            llm-security-application-gateway llm-security-nemo-hub \
            llm-security-presidio-spoke 2>/dev/null || true
