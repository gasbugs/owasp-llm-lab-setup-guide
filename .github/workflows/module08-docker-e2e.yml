name: Module 08 Docker E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "llm-security-control-plane/**"
      - "examples/security-monitoring/**"
      - "tests/browser/**"
      - "tests/e2e/module10/**"
      - ".github/workflows/module08-docker-e2e.yml"

permissions:
  contents: read

jobs:
  docker-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Confirm Docker Engine and install jq
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq
          docker version
          docker compose version
          python -m pip install --requirement tests/browser/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build the real control-plane images
        run: |
          bash llm-security-control-plane/deploy/build-images.sh
          docker build -f examples/day6/nemo-guardrails/Containerfile \
            -t localhost/llm-security-nemo-dialog-rails:0.22.0 \
            examples/day6/nemo-guardrails
          docker build -f examples/day6/presidio/Containerfile \
            -t localhost/day6-presidio:2.2.362 \
            examples/day6/presidio
          docker build -f llm-security-control-plane/official-uis/nemo/Containerfile \
            -t localhost/llm-security-nemo-official-ui:0.22.0 \
            llm-security-control-plane
          docker build -f llm-security-control-plane/official-uis/promptfoo/Containerfile \
            -t localhost/llm-security-promptfoo-official-ui:0.121.20 \
            llm-security-control-plane
          docker build -f llm-security-control-plane/official-uis/pyrit/Containerfile \
            -t localhost/llm-security-pyrit-official-ui:1.0.1 \
            llm-security-control-plane

      - name: Validate the standalone Module 10 Compose model
        run: |
          install -d -m 0700 llm-security-control-plane/.state/application-auth
          cat > llm-security-control-plane/.state/module10-compose.env <<'EOF'
          AWS_PROFILE=default
          AWS_REGION=us-east-1
          USE_EC2_INSTANCE_ROLE=false
          LOCAL_UID=1001
          LOCAL_GID=1001
          BEDROCK_MODEL_ID=us.amazon.nova-lite-v1:0
          PRESIDIO_INTERNAL_TOKEN=ci-presidio-token
          APPLICATION_INTERNAL_TOKEN=ci-application-token
          BEDROCK_GATEWAY_TOKEN=ci-bedrock-token
          TELEMETRY_INGEST_TOKEN=ci-telemetry-token
          TELEMETRY_HMAC_KEY=ci-telemetry-hmac-key
          LLM_MONITOR_TOKEN=ci-monitor-token
          LLM_MONITOR_ADMIN_TOKEN=ci-monitor-admin-token
          RETRIEVAL_SERVICE_TOKEN=ci-retrieval-token
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=ci-grafana-password
          AUTH_ADMIN_TOKEN=ci-auth-admin-token
          CONTROL_PLANE_NETWORK_NAME=llm-security-observability
          OBSERVABILITY_NETWORK_NAME=llm-security-observability
          OTEL_EXPORTER_OTLP_ENDPOINT=http://llm-sec-alloy:4318
          SECURITY_MONITOR_URL=http://llm-sec-gateway:8080
          AUTH_EVENT_SINK=stdout,monitor
          EOF
          docker compose \
            --env-file llm-security-control-plane/.state/module10-compose.env \
            --file examples/security-monitoring/compose.module10.yaml \
            config --services | tee /tmp/module10-services.txt
          grep -Fx application /tmp/module10-services.txt
          grep -Fx grafana /tmp/module10-services.txt

      - name: Run the progressive learner sequence
        run: bash llm-security-control-plane/tests/e2e-learning-sequence.sh

      - name: Run learner-authored first-tool tutorials
        run: bash llm-security-control-plane/tests/e2e-first-tool-tutorials.sh

      - name: Run the deterministic PyRIT adaptive-turn contract
        run: bash llm-security-control-plane/tests/e2e-pyrit-contract.sh

      - name: Smoke-test the real Bedrock Gateway entrypoint imports
        run: |
          docker run --rm --network none \
            --entrypoint python \
            --env AWS_EC2_METADATA_DISABLED=true \
            --env AWS_ACCESS_KEY_ID=test \
            --env AWS_SECRET_ACCESS_KEY=test \
            --env AWS_REGION=us-east-1 \
            --env BEDROCK_GATEWAY_TOKEN=e2e-bedrock-token \
            localhost/llm-security-bedrock-gateway:1.0.0 \
            -c 'import httpx; import telemetry; import server; print("real-bedrock-gateway-import=PASS")'

      - name: Start the deterministic Bedrock contract gateway
        run: |
          docker network create llm-security-control-plane
          docker run --detach --name module08-bedrock-contract \
            --network llm-security-control-plane \
            --network-alias llm-security-bedrock-gateway \
            --publish 18097:8080 \
            --env BEDROCK_GATEWAY_TOKEN=e2e-bedrock-token \
            --volume "$PWD/llm-security-control-plane/tests/fake_bedrock_gateway.py:/app/server.py:ro" \
            docker.io/library/python:3.12-slim python /app/server.py

      - name: Start and validate the product official UIs
        run: |
          docker run --detach --name nemo-official-ui \
            --network llm-security-control-plane \
            --network-alias llm-security-nemo-official-ui \
            --publish 127.0.0.1:28192:8000 \
            --env BEDROCK_GATEWAY_TOKEN=e2e-bedrock-token \
            localhost/llm-security-nemo-official-ui:0.22.0
          docker run --detach --name promptfoo-official-ui \
            --network llm-security-control-plane \
            --network-alias llm-security-promptfoo-official-ui \
            --publish 127.0.0.1:25500:15500 \
            localhost/llm-security-promptfoo-official-ui:0.121.20
          docker run --detach --name pyrit-official-ui \
            --network llm-security-control-plane \
            --network-alias llm-security-pyrit-official-ui \
            --publish 127.0.0.1:28098:8000 \
            localhost/llm-security-pyrit-official-ui:1.0.1

          curl --fail --location --retry 60 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:28192/ | grep -F '<title>Assistant</title>'
          curl --fail --retry 60 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:25500/ >/dev/null
          curl --fail --retry 60 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:28098/ >/dev/null

          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"model":"dialog","messages":[{"role":"user","content":"보안팀 연락처를 알려 주세요."}]}' \
            http://127.0.0.1:28192/v1/chat/completions \
            | tee /tmp/nemo-official-chat.json
          jq -e '.choices[0].message.content == "보안팀 연락처: security@example.com"' \
            /tmp/nemo-official-chat.json

      - name: Run the complete control-plane E2E without intermediate errors
        env:
          MODEL_PROVIDER: amazon-bedrock
          BEDROCK_MODEL_ID: us.amazon.nova-lite-v1:0
          MODEL_GATEWAY_URL: http://module08-bedrock-contract:8080
          BEDROCK_GATEWAY_TEST_URL: http://127.0.0.1:18097
          START_BEDROCK_GATEWAY: "false"
          KEEP_CONTROL_PLANE: "true"
        run: |
          set -o pipefail
          bash llm-security-control-plane/tests/e2e-control-plane.sh 2>&1 | tee /tmp/module08-e2e.log
          ! grep -E '(^|[[:space:]])(Error:|INFRA:|Traceback|curl:)|service did not become ready' /tmp/module08-e2e.log

      - name: Run the deterministic Control Center browser contract
        # e2e-control-plane.sh deliberately publishes its isolated Application on
        # 28095, not the learner runtime's canonical 18095 port.
        run: >-
          python tests/browser/run_control_plane_ui.py
          --url http://127.0.0.1:28095
          --browser-channel chromium

      - name: Build and validate independent tenant 03 H21, H22, H02, then H01
        env:
          AWS_CREDENTIALS_DIR: /tmp/guided-aws
          GUIDED_SESSION_SECRET: ci-guided-session-secret
          GUIDED_CONTROL_LAB01_TOKEN: ci-control-lab
          GUIDED_CONTROL_LAB02_TOKEN: ci-control-lab02
          GUIDED_CONTROL_H21_TOKEN: ci-control-h21
          GUIDED_CONTROL_H22_TOKEN: ci-control-h22
          GUIDED_CONTROL_VERIFIER_TOKEN: ci-control-verifier
          GUIDED_LAB01_GATEWAY_TOKEN: ci-lab-gateway
          GUIDED_H02_GATEWAY_TOKEN: ci-h02-gateway
          GUIDED_LAB02_PROVISION_TOKEN: ci-lab02-provision
          GUIDED_NEMO_GATEWAY_TOKEN: ci-nemo-gateway
          GUIDED_H21_PROVIDER_TOKEN: ci-h21-provider
          GUIDED_H21_OAUTH_SECRET: ci-h21-oauth-secret
          GUIDED_H22_APPROVAL_SECRET: ci-h22-approval-secret
          GUIDED_VERIFIER_LAB01_TOKEN: ci-verifier-lab
          GUIDED_VERIFIER_LAB02_TOKEN: ci-verifier-lab02
          GUIDED_VERIFIER_H21_TOKEN: ci-verifier-h21
          GUIDED_VERIFIER_H22_TOKEN: ci-verifier-h22
          GUIDED_VERIFIER_GATEWAY_TOKEN: ci-verifier-gateway
          GUIDED_PROVIDER_MODE: contract
          GUIDED_HOST_PORT: "28097"
          GUIDED_NEMO_HOST_PORT: "28193"
          LOCAL_UID: "1001"
          LOCAL_GID: "1001"
        run: |
          mkdir -p /tmp/guided-aws llm-security-control-plane/.state/guided-gateway
          docker compose --file examples/security-monitoring/compose.guided.yaml up -d --build
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:28097/proxy-healthz
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:28193/v1/rails/configs | jq -e '.[0].id == "dialog"'
          proxy_id=$(docker inspect --format '{{.Id}}' llm-security-guided-front-proxy)
          docker compose --file examples/security-monitoring/compose.guided.yaml \
            up -d --no-deps --force-recreate guided-nemo-ui
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:28193/v1/rails/configs | jq -e '.[0].id == "dialog"'
          test "$proxy_id" = \
            "$(docker inspect --format '{{.Id}}' llm-security-guided-front-proxy)"
          python tests/browser/run_guided_control_center_ui.py \
            --url http://127.0.0.1:28097 \
            --browser-channel chromium
          test "$(docker ps --filter publish=28097 --format '{{.Names}}')" = \
            llm-security-guided-front-proxy

      - name: Preserve Docker diagnostics on failure
        if: failure()
        run: |
          docker ps --all
          docker logs module08-bedrock-contract || true
          docker logs llm-security-presidio-spoke || true
          docker logs llm-security-nemo-hub || true
          docker logs llm-security-application-gateway || true
          docker logs nemo-official-ui || true
          docker logs promptfoo-official-ui || true
          docker logs pyrit-official-ui || true
          docker compose --file examples/security-monitoring/compose.guided.yaml logs || true

      - name: Remove test resources
        if: always()
        env:
          AWS_CREDENTIALS_DIR: /tmp/guided-aws
          GUIDED_SESSION_SECRET: ci-guided-session-secret
          GUIDED_CONTROL_LAB01_TOKEN: ci-control-lab
          GUIDED_CONTROL_LAB02_TOKEN: ci-control-lab02
          GUIDED_CONTROL_H21_TOKEN: ci-control-h21
          GUIDED_CONTROL_H22_TOKEN: ci-control-h22
          GUIDED_CONTROL_VERIFIER_TOKEN: ci-control-verifier
          GUIDED_LAB01_GATEWAY_TOKEN: ci-lab-gateway
          GUIDED_H02_GATEWAY_TOKEN: ci-h02-gateway
          GUIDED_LAB02_PROVISION_TOKEN: ci-lab02-provision
          GUIDED_NEMO_GATEWAY_TOKEN: ci-nemo-gateway
          GUIDED_H21_PROVIDER_TOKEN: ci-h21-provider
          GUIDED_H21_OAUTH_SECRET: ci-h21-oauth-secret
          GUIDED_H22_APPROVAL_SECRET: ci-h22-approval-secret
          GUIDED_VERIFIER_LAB01_TOKEN: ci-verifier-lab
          GUIDED_VERIFIER_LAB02_TOKEN: ci-verifier-lab02
          GUIDED_VERIFIER_H21_TOKEN: ci-verifier-h21
          GUIDED_VERIFIER_H22_TOKEN: ci-verifier-h22
          GUIDED_VERIFIER_GATEWAY_TOKEN: ci-verifier-gateway
          GUIDED_PROVIDER_MODE: contract
          GUIDED_HOST_PORT: "28097"
          GUIDED_NEMO_HOST_PORT: "28193"
          LOCAL_UID: "1001"
          LOCAL_GID: "1001"
        run: |
          docker compose --file examples/security-monitoring/compose.guided.yaml down --volumes || true
          docker rm --force module08-bedrock-contract \
            nemo-official-ui promptfoo-official-ui pyrit-official-ui \
            llm-security-application-gateway llm-security-nemo-hub \
            llm-security-presidio-spoke 2>/dev/null || true
