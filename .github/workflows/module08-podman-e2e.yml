name: Module 08 Podman E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "llm-security-control-plane/**"
      - ".github/workflows/module08-podman-e2e.yml"

permissions:
  contents: read

jobs:
  podman-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials for the real Bedrock browser path
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Install Podman and jq
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman jq
          python -m pip install --requirement tests/browser/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build the real control-plane images
        run: bash llm-security-control-plane/deploy/build-images.sh

      - name: Restore the nightly Module 08 AWS state
        env:
          AWS_REGION: us-east-1
        run: bash llm-security-control-plane/deploy/restore-module08-aws.sh --repair

      - name: Smoke-test the real Bedrock Gateway entrypoint imports
        run: |
          podman run --rm --network none \
            --entrypoint python \
            --env AWS_EC2_METADATA_DISABLED=true \
            --env AWS_ACCESS_KEY_ID=test \
            --env AWS_SECRET_ACCESS_KEY=test \
            --env AWS_REGION=us-east-1 \
            localhost/llm-security-bedrock-gateway:1.0.0 \
            -c 'import httpx; import telemetry; import server; print("real-bedrock-gateway-import=PASS")'

      - name: Run the complete control-plane E2E without intermediate errors
        env:
          MODEL_PROVIDER: amazon-bedrock
          BEDROCK_MODEL_ID: us.amazon.nova-lite-v1:0
          START_BEDROCK_GATEWAY: "true"
          KEEP_CONTROL_PLANE: "true"
        run: |
          set -o pipefail
          bash llm-security-control-plane/tests/e2e-control-plane.sh 2>&1 | tee /tmp/module08-e2e.log
          ! grep -E '(^|[[:space:]])(Error:|INFRA:|Traceback|curl:)|service did not become ready' /tmp/module08-e2e.log

      - name: Run the Control Center browser contract at desktop and mobile widths
        run: python tests/browser/run_control_plane_ui.py --browser-channel chromium

      - name: Preserve Podman diagnostics on failure
        if: failure()
        run: |
          podman ps --all
          podman logs llm-security-bedrock-gateway || true
          podman logs llm-security-presidio-spoke || true
          podman logs llm-security-nemo-hub || true
          podman logs llm-security-application-gateway || true

      - name: Remove test resources
        if: always()
        run: |
          podman rm --force llm-security-bedrock-gateway \
            llm-security-application-gateway llm-security-nemo-hub \
            llm-security-presidio-spoke 2>/dev/null || true
