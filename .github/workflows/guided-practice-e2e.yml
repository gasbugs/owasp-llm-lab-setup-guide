name: Tenant 03 Practice E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["llm-security-control-plane/**", "examples/security-monitoring/**", "tests/**", "tools/practice_workspace.py", ".github/workflows/guided-practice-e2e.yml"]
  pull_request:
    paths: ["llm-security-control-plane/**", "examples/security-monitoring/**", "tests/**", "tools/practice_workspace.py", ".github/workflows/guided-practice-e2e.yml"]

permissions:
  contents: read

jobs:
  reused-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        activities: ["H06 H05", "H11 H10 H08 H07", "H13 H09 H16", "H15 H14", "H22 H21"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - env:
          ACTIVITIES: ${{ matrix.activities }}
        run: |
          if [ "$ACTIVITIES" = "H22 H21" ]; then
            python tests/e2e/check_guided_reused_http.py --activities $ACTIVITIES --isolation-check
          else
            python tests/e2e/check_guided_reused_http.py --activities $ACTIVITIES
          fi

  implementation-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        practice: [P01, P02, P03, P04, P12, P17, P18, P19, P20]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Browser dependencies
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Starter and implemented service
        env:
          PRACTICE: ${{ matrix.practice }}
        run: python tests/e2e/run_practice_ci_pair.py "$PRACTICE" --output /tmp/practice-evidence

  canonical-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python tests/e2e/check_guided_reused_http.py --startup-only

  problem-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: |
          python -m unittest discover -s tests/unit -p 'test_practice_*.py'
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
          python tests/browser/check_guided_problem_surface.py /tmp/practice-surface/surface.json
