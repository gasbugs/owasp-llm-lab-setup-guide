name: Remove retired LLMGoat packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete retired container packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for package in llmgoat-gpu owasp-llm-llmgoat; do
            status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/users/gasbugs/packages/container/${package}")
            if [ "$status" != "204" ] && [ "$status" != "404" ]; then
              cat response.json
              exit 1
            fi
            echo "${package}: HTTP ${status}"
          done
