name: Build and Push LLM03 Tools Image

on:
  pull_request:
    paths:
      - "examples/llm03/Dockerfile.llama-cpp"
      - "tests/unit/test_llm03_tools_image.py"
      - ".github/workflows/llm03-tools.yaml"
  push:
    branches: [main]
    paths:
      - "examples/llm03/Dockerfile.llama-cpp"
      - "tests/unit/test_llm03_tools_image.py"
      - ".github/workflows/llm03-tools.yaml"
  workflow_dispatch:

concurrency:
  group: llm03-tools-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/gasbugs/owasp-llm-llm03-tools
  SHA_TAG: sha-${{ github.sha }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: ./examples/llm03
          file: ./examples/llm03/Dockerfile.llama-cpp
          call: check
          build-args: |
            VCS_REF=${{ github.sha }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite immutable tag
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository="gasbugs/owasp-llm-llm03-tools"
          token="$(curl -fsS -u "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
            --get 'https://ghcr.io/token' \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:${repository}:pull,push" \
            | jq -er '.token')"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${repository}/manifests/${SHA_TAG}")"
          test "$status" = 404 || {
            echo "ERROR: immutable image tag is not absent: HTTP $status" >&2
            exit 1
          }

      - name: Build and push immutable LLM03 tools image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./examples/llm03
          file: ./examples/llm03/Dockerfile.llama-cpp
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA_TAG }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
