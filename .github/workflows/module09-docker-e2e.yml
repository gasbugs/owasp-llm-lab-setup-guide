name: Module 09 Docker E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "examples/security-monitoring/**"
      - "tests/e2e/security-monitoring/**"
      - ".github/workflows/module09-docker-e2e.yml"

permissions:
  contents: read

jobs:
  docker-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Confirm Docker Engine and install jq
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq
          docker version
          docker compose version

      - name: Run the complete observability E2E twice
        env:
          USE_REAL_BEDROCK: "false"
          RUN_FAILURE_DRILL: "true"
        run: |
          bash tests/e2e/security-monitoring/test_security_monitoring.sh 2>&1 | tee /tmp/module09-e2e-1.log
          bash tests/e2e/security-monitoring/test_security_monitoring.sh 2>&1 | tee /tmp/module09-e2e-2.log
          ! grep -E '(^|[[:space:]])(Error:|INFRA:|Traceback)' \
            /tmp/module09-e2e-1.log /tmp/module09-e2e-2.log

      - name: Preserve Docker diagnostics on failure
        if: failure()
        run: |
          docker ps --all
          docker images
