services:
  gateway:
    environment:
      BEDROCK_GATEWAY_URL: http://llm-security-bedrock-gateway:8080

  llm-security-bedrock-gateway:
    image: localhost/llm-security-gateway:3.0
    container_name: llm-security-bedrock-gateway
    command: ["python", "/app/fake_bedrock_gateway.py"]
    volumes:
      - ../../llm-security-control-plane/tests/fake_bedrock_gateway.py:/app/fake_bedrock_gateway.py:ro,Z
    networks: [observability]
    security_opt: [no-new-privileges]
